[package]
name = "cinnabar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["macos", "windows"]
reads = [
    "assets/bedrock-target.json",
    "assets/cinnangles-sans-source.json",
    "assets/vanilla-source.json",
    "crates/assets/data/*",
    "crates/client-presentation/src/local_player.rs",
    "crates/mod-api/wit/extension.wit",
    "crates/mod-host/src/tests/gameplay.wat",
    "crates/mod-host/src/tests/guest.wat",
    "crates/protocol/fixtures/crafting_data_manual_named_1x1.bin",
    "crates/render/src/atmosphere.wesl",
    "crates/render/src/cloud.wesl",
    "examples/mods/screen-probe",
]

# No doctests here; skipping rustdoc's pass over the crate saves a full re-parse.
[lib]
doctest = false

# main.rs only dispatches into the library; its tests live there.
[[bin]]
name = "cinnabar"
path = "src/main.rs"
test = false

[features]
# Counts allocation requests and labelled GPU writes for diagnostic runs.
alloc-stats = ["dep:test-alloc", "test-alloc/global-stats", "render/alloc-stats", "render-scene/alloc-stats"]
# Developer runs and client MCP keep acceptance; packaging opts out with --no-default-features.
default = ["acceptance"]
acceptance = ["dep:acceptance"]
enhanced = ["render/enhanced"]
enhanced-diagnostics = ["enhanced", "developer-control", "acceptance", "render/enhanced-diagnostics"]
# Loopback control endpoint for scripted driving and recording; never in release builds.
developer-control = ["dep:developer-control", "client-shell/developer-control"]
# Records Bevy schedules, systems, render graph, submission and presentation spans.
frame-trace = ["bevy/trace_chrome", "bevy/debug"]
# Live CPU attribution through Bevy, wgpu's encoding and submission scopes, and the owned
# streaming/render hot paths.
tracy = ["bevy/trace", "bevy/debug", "dep:tracing-tracy", "dep:profiling", "chunk-pipeline/tracy", "render/tracy", "client-ui/tracy"]
# Compiles the offline pack reports and benchmarks into the test build.
reports = []
# Opt-in allocator for release-profile measurements.
mimalloc = ["dep:mimalloc"]

[dependencies]
test-alloc = { path = "../crates/test-alloc", optional = true }
protocol-ids = { path = "../crates/protocol-ids" }
mimalloc = { workspace = true, optional = true }
pack-json = { path = "../crates/pack-json" }
env-compat = { path = "../crates/env-compat" }
simulation-clock = { path = "../crates/simulation-clock" }
render-scene = { path = "../crates/render-scene" }
client-shell = { path = "../crates/client-shell" }
client-interaction = { path = "../crates/client-interaction" }
client-runtime = { path = "../crates/client-runtime" }
client-extensions = { path = "../crates/client-extensions" }
client-state = { path = "../crates/client-state" }
client-audio = { path = "../crates/client-audio" }
pack-runtime = { path = "../crates/pack-runtime" }
first-run = { path = "../crates/first-run" }
launcher-host = { path = "../crates/launcher-host" }
bridge = { path = "../crates/bridge" }
experience-sdk = { path = "../crates/experience-sdk", default-features = false, features = ["declarations"] }
mod-api = { path = "../crates/mod-api" }
mod-render = { path = "../crates/mod-render" }
block-transform = { path = "../crates/block-transform" }
tracing-tracy = { version = "=0.12.0", default-features = false, features = ["enable", "only-localhost", "ondemand"], optional = true }
profiling = { version = "=1.0.18", default-features = false, features = ["profile-with-tracing"], optional = true }
acceptance = { path = "../crates/acceptance", optional = true }
diagnostics = { path = "../crates/diagnostics" }
developer-control = { path = "../crates/developer-control", optional = true }
client-presentation = { path = "../crates/client-presentation" }
gameplay = { path = "../crates/gameplay" }
client-session = { path = "../crates/client-session" }
client-ui = { path = "../crates/client-ui" }
launcher = { path = "../crates/launcher" }
update-manifest = { path = "../crates/update-manifest" }
rich-presence = { path = "../crates/rich-presence" }
player-state = { path = "../crates/player-state" }
inventory = { path = "../crates/inventory" }
bytes.workspace = true
anyhow.workspace = true
pack-compile-input = { path = "../crates/pack-compiler/input" }
pack-compiler = { path = "../crates/pack-compiler" }
pack-entity-compiler = { path = "../crates/pack-compiler/entity" }
assets = { path = "../crates/assets" }
bevy.workspace = true
glam.workspace = true
crossbeam-channel = "0.5"
fontdue = { version = "0.9.3", default-features = false, features = ["std"] }
chunk-pipeline = { path = "../crates/chunk-pipeline" }
far-terrain = { path = "../crates/far-terrain" }
client-world = { path = "../crates/client-world" }
actor-animation = { path = "../crates/actor-animation" }
image.workspace = true
json-ui = { path = "../crates/json-ui" }
meshing = { path = "../crates/meshing" }
oreui = { path = "../crates/oreui" }
mod-ui = { path = "../crates/mod-ui" }
mod-host = { path = "../crates/mod-host" }
particles = { path = "../crates/particles" }
protocol = { path = "../crates/protocol" }
resource-pack = { path = "../crates/resource-pack" }
server-experience = { path = "../crates/server-experience" }
rayon.workspace = true
render = { path = "../crates/render" }
render-api = { path = "../crates/render-api" }
render-model = { path = "../crates/render-model" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
semantic-input = { path = "../crates/input" }
sim = { path = "../crates/sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true
url = "2"
tokio.workspace = true
ui = { path = "../crates/ui" }
ui-engine = { path = "../crates/ui-engine" }
ui-screens = { path = "../crates/ui-screens" }
wgpu.workspace = true
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
world = { path = "../crates/world" }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { workspace = true, features = ["gles"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSRunLoop", "NSString"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CADisplayLink", "CAFrameRateRange"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
mimalloc.workspace = true
wat = "1"
actor-animation = { path = "../crates/actor-animation", features = ["test-support"] }
test-alloc = { path = "../crates/test-alloc" }
client-shell = { path = "../crates/client-shell", features = ["test-support"] }
client-interaction = { path = "../crates/client-interaction", features = ["test-support"] }
assets = { path = "../crates/assets", features = ["test-support"] }
client-runtime = { path = "../crates/client-runtime", features = ["test-support"] }
client-audio = { path = "../crates/client-audio", features = ["test-support"] }
pack-runtime = { path = "../crates/pack-runtime", features = ["test-support"] }
launcher-host = { path = "../crates/launcher-host", features = ["test-support"] }
launcher = { path = "../crates/launcher", features = ["test-support"] }
test-time = { path = "../crates/test-time" }
wit-component.workspace = true
tempfile = "3"
rodio = { version = "=0.20.1", default-features = false }
acceptance = { path = "../crates/acceptance", features = ["test-support"] }
client-presentation = { path = "../crates/client-presentation", features = ["test-support"] }
gameplay = { path = "../crates/gameplay", features = ["test-support"] }
client-session = { path = "../crates/client-session", features = ["test-support"] }
client-ui = { path = "../crates/client-ui", features = ["test-support"] }
ui-engine = { path = "../crates/ui-engine", features = ["test-support"] }
protocol = { path = "../crates/protocol", features = ["test-support"] }
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
pack-compile-input = { path = "../crates/pack-compiler/input" }
pack-compiler = { path = "../crates/pack-compiler" }
pack-entity-compiler = { path = "../crates/pack-compiler/entity" }
chunk-pipeline = { path = "../crates/chunk-pipeline", features = ["publication-test-support"] }
render = { path = "../crates/render", features = ["publication-test-support"] }

[lints]
workspace = true

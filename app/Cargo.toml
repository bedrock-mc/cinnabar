[package]
name = "bedrock-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# No doctests here; skipping rustdoc's pass over the crate saves a full re-parse.
[lib]
doctest = false

# main.rs only dispatches into the library; its tests live there.
[[bin]]
name = "bedrock-client"
path = "src/main.rs"
test = false

[features]
default = ["acceptance"]
acceptance = ["dep:acceptance"]
enhanced = ["render/enhanced"]
# Honours CINNABAR_MOD_COMPONENT by running a local Wasmtime component.
local-mods = ["mod-host/execution"]
# Compiles the offline pack reports and benchmarks into the test build.
reports = []

[dependencies]
acceptance = { path = "../crates/acceptance", optional = true }
diagnostics = { path = "../crates/diagnostics" }
client-presentation = { path = "../crates/client-presentation" }
gameplay = { path = "../crates/gameplay" }
client-session = { path = "../crates/client-session" }
client-ui = { path = "../crates/client-ui" }
launcher = { path = "../crates/launcher" }
player-state = { path = "../crates/player-state" }
inventory = { path = "../crates/inventory" }
bytes.workspace = true
anyhow.workspace = true
pack-compiler = { path = "../crates/pack-compiler" }
assets = { path = "../crates/assets" }
bevy.workspace = true
crossbeam-channel = "0.5"
ctrlc = { version = "3.4", features = ["termination"] }
fontdue = { version = "0.9.3", default-features = false, features = ["std"] }
chunk-pipeline = { path = "../crates/chunk-pipeline" }
client-world = { path = "../crates/client-world" }
image.workspace = true
json-ui = { path = "../crates/json-ui" }
meshing = { path = "../crates/meshing" }
mod-host = { path = "../crates/mod-host", default-features = false }
particles = { path = "../crates/particles" }
protocol = { path = "../crates/protocol" }
resource-pack = { path = "../crates/resource-pack" }
server-experience = { path = "../crates/server-experience" }
rayon.workspace = true
render = { path = "../crates/render" }
render-model = { path = "../crates/render-model" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
semantic-input = { path = "../crates/input" }
sim = { path = "../crates/sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true
url = "2"
tokio.workspace = true
ui = { path = "../crates/ui" }
wgpu.workspace = true
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
world = { path = "../crates/world" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "process", "std", "stdio"] }

[dev-dependencies]
tempfile = "3"
rodio = { version = "=0.20.1", default-features = false }
acceptance = { path = "../crates/acceptance", features = ["test-support"] }
client-presentation = { path = "../crates/client-presentation", features = ["test-support"] }
gameplay = { path = "../crates/gameplay", features = ["test-support"] }
client-session = { path = "../crates/client-session", features = ["test-support"] }
client-ui = { path = "../crates/client-ui", features = ["test-support"] }
protocol = { path = "../crates/protocol", features = ["wire-test-support"] }
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
pack-compiler = { path = "../crates/pack-compiler" }
chunk-pipeline = { path = "../crates/chunk-pipeline", features = ["publication-test-support"] }
render = { path = "../crates/render", features = ["publication-test-support"] }

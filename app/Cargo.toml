[package]
name = "bedrock-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
inventory = { path = "../crates/inventory" }
bytes.workspace = true
anyhow.workspace = true
arboard = { version = "3", default-features = false }
pack-compiler = { path = "../crates/pack-compiler" }
assets = { path = "../crates/assets" }
bevy = { workspace = true, default-features = false, features = [
    "bevy_anti_alias",
    "bevy_camera",
    "bevy_image",
    "bevy_winit",
    "bevy_window",
    "keyboard",
    "mouse",
    "std",
    "bevy_post_process",
] }
crossbeam-channel = "0.5"
crossbeam-queue = "=0.3.13"
ctrlc = { version = "3.4", features = ["termination"] }
fontdue = { version = "0.9.3", default-features = false, features = ["std"] }
client-world = { package = "chunk-pipeline", path = "../crates/chunk-pipeline" }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tga"] }
json-ui = { path = "../crates/json-ui" }
meshing = { path = "../crates/meshing" }
mod-host = { path = "../crates/mod-host" }
protocol = { path = "../crates/protocol" }
resource-pack = { path = "../crates/resource-pack" }
server-experience = { path = "../crates/server-experience" }
rayon.workspace = true
rodio = { version = "=0.20.1", default-features = false }
render = { path = "../crates/render" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
semantic-input = { path = "../crates/input" }
sim = { path = "../crates/sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true
url = "2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
ui = { path = "../crates/ui" }
wgpu = { version = "27.0.1", default-features = false, features = ["wgsl"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
world = { path = "../crates/world" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "process", "std", "stdio"] }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { workspace = true, default-features = false, features = ["wayland", "x11"] }

[dev-dependencies]
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
pack-compiler = { path = "../crates/pack-compiler" }
client-world = { package = "chunk-pipeline", path = "../crates/chunk-pipeline", features = ["publication-test-support"] }
render = { path = "../crates/render", features = ["publication-test-support"] }

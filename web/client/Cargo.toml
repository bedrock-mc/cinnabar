[package]
name = "web-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Cinnabar's browser entry: the client compiled to WebAssembly, joining through a web relay."

[lib]
crate-type = ["cdylib", "rlib"]

# Native builds compile an empty crate, so workspace builds never pull the browser stack.
[target.'cfg(target_arch = "wasm32")'.dependencies]
assets = { path = "../../crates/assets" }
bedrock-client = { path = "../../app", default-features = false }
bridge = { path = "../../crates/bridge" }
console_error_panic_hook = "0.1.7"
js-sys.workspace = true
launcher = { path = "../../crates/launcher" }
launcher-host = { path = "../../crates/launcher-host" }
wasm-bindgen.workspace = true

[lints]
workspace = true

[package]
name = "web-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
assets = { path = "../../crates/assets" }
bridge = { path = "../../crates/bridge" }
web-transport = { path = "../transport" }
semantic-input = { path = "../../crates/input" }
launcher = { path = "../../crates/launcher" }
futures.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
protocol = { path = "../../crates/protocol" }
client-session = { path = "../../crates/client-session" }
cinnabar = { path = "../../app", default-features = false }
client-audio = { path = "../../crates/client-audio" }
web-sys = { version = "0.3.104", features = ["AudioContext"] }
js-sys = "0.3.104"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"

[dev-dependencies]
tempfile = "3"
tokio.workspace = true

[lints]
workspace = true

[package]
name = "web-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["windows"]
reads = ["crates/protocol/tests/fixtures/native-client-data-validation.json"]

[features]
webtransport = ["dep:h3", "dep:h3-quinn", "dep:h3-webtransport", "dep:quinn"]
operator = [
    "dep:clap",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:x509-parser",
    "tokio/fs",
    "tokio/rt-multi-thread",
    "tokio/signal",
]

[[bin]]
name = "bedrock-web-relay"
path = "src/bin/bedrock-web-relay.rs"
required-features = ["operator"]

[dependencies]
bridge = { path = "../../crates/bridge" }
bytes.workspace = true
futures.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { workspace = true, features = ["codec"] }
zeroize = "1"
hex = "0.4"
subtle = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
h3 = { version = "=0.0.8", git = "https://github.com/cinnabar-mc/h3", rev = "2ef8eb6b644bd9979ffe987e6a09ee2fa6b83402", optional = true }
h3-quinn = { version = "=0.0.10", git = "https://github.com/cinnabar-mc/h3", rev = "2ef8eb6b644bd9979ffe987e6a09ee2fa6b83402", features = ["datagram"], optional = true }
h3-webtransport = { version = "=0.1.2", git = "https://github.com/cinnabar-mc/h3", rev = "2ef8eb6b644bd9979ffe987e6a09ee2fa6b83402", optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
x509-parser = { version = "0.18", optional = true }
tokio = { workspace = true, features = ["net"] }
protocol = { path = "../../crates/protocol", features = ["native-networking"] }
bedrock-services.workspace = true
bedrock-net = { workspace = true, features = ["raknet"] }
p384 = { version = "0.14", default-features = false, features = ["std", "ecdsa"] }
rand = "0.10"
httparse = "1"
http = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tokio-websockets = { version = "0.13", default-features = false, features = ["server", "aws_lc_rs"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
raknet.workspace = true
protocol = { path = "../../crates/protocol", features = ["test-support"] }
rcgen = "0.14"
test-time = { path = "../../crates/test-time" }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "getrandom"] }

[lints]
workspace = true

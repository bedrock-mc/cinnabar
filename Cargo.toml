    "crates/test-time",
    "crates/render-model",
    "crates/render-scene",
    "crates/inventory",
    "crates/launcher",
    "crates/launcher-host",
    "crates/first-run",
    "crates/rich-presence",
    "crates/client-ui",
    "crates/client-presentation",
    "crates/client-audio",
    "crates/player-state",
    "crates/sim",
    "crates/ui",
    "crates/ui-engine",
    "crates/ui-screens",
    "crates/world",
    "crates/simulation-clock",
    "crates/env-compat",
    "crates/update-manifest",
    "crates/update-installer",
    "tools/architecture",
    "tools/bedrock-replay",
    "tools/devtool",

[workspace.package]
version = "0.1.28"
edition = "2024"
rust-version = "1.99.0"

[workspace.dependencies]
bedrock-protocol-1-26-51 = { git = "https://github.com/cinnabar-mc/protocolgen", rev = "4e9626abbb51b8fa842f49b4aea0fb4d3c01a682" }
raknet = { git = "https://github.com/cinnabar-mc/raknet", rev = "4d9f23a47d55c4c39aa2952d1b3f540f347b530f" }
bedrock-services = { git = "https://github.com/cinnabar-mc/bedrock-services", rev = "3c80f8e147477b9cae5f5ba1e3ef066ec265b12d" }
nethernet = { git = "https://github.com/cinnabar-mc/nethernet", rev = "fed09fc05afb3b0fe34d0e7b18702f7ea86c3290" }
nethernet-tokio = { git = "https://github.com/cinnabar-mc/nethernet", rev = "fed09fc05afb3b0fe34d0e7b18702f7ea86c3290" }
bedrock-net = { git = "https://github.com/cinnabar-mc/bedrock-net", rev = "ef9f04a4acb7ead244544632bd737c20408d830b" }
bedrock-client = { git = "https://github.com/cinnabar-mc/bedrock-net", rev = "ef9f04a4acb7ead244544632bd737c20408d830b" }
bedrock-client-tokio = { git = "https://github.com/cinnabar-mc/bedrock-net", rev = "ef9f04a4acb7ead244544632bd737c20408d830b" }
bedrock-packs = { git = "https://github.com/cinnabar-mc/bedrock-net", rev = "ef9f04a4acb7ead244544632bd737c20408d830b" }
glam = { version = "0.33.2", default-features = false, features = ["std", "f64"] }
# One feature set per heavy dependency: any per-crate difference rebuilds it and every dependent.
# wayland/x11 only select winit backends on Linux; winit ignores them on other targets.
bevy = { version = "=0.20.0", default-features = false, features = [
    "bevy_anti_alias",
    "smaa_luts",
    "ktx2",
    "zstd_rust",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_log",
    "bevy_mesh",
    "bevy_post_process",
    "bevy_render",
    "bevy_shader",
    "bevy_window",
    "bevy_winit",
    "gamepad",
    "keyboard",
    "mouse",
    "multi_threaded",
    "std",
    "wayland",
    "x11",
] }
# The noop backend only runs when an instance explicitly enables it (render tests).
# `std` keeps error scopes per thread; without it, concurrent pipeline compiles share one stack.
wgpu = { version = "30.0.1", default-features = false, features = ["noop", "std", "wgsl"] }
# Every crate that names naga uses this one feature set, so `-p cinnabar` and `--workspace`
# builds agree on naga and nothing above it (wgpu, bevy_render) builds twice. `glsl-in` is the
# Java shader-pack frontend; it adds only naga's GLSL parser and pp-rs.
naga = { version = "30.0.1", features = ["glsl-in", "wgsl-in"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tga"] }
# Native bridge and session composition add OS I/O and the multithreaded runtime.
tokio = { version = "1.52", features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-util = "0.7"
web-time = "1.1"
bytes = "1"
futures = "0.3"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-error = "0.2"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.11"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
mimalloc = { version = "=0.1.52", default-features = false }
sha2 = "=0.10.9"
rsa = { version = "0.10.0-rc.19", default-features = false, features = ["std", "sha2"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Crates that generate random UUIDs add `v4`; wasm32-unknown-unknown has no source for it.
uuid = "1"
wasmtime = { version = "=36.0.16", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"] }
wit-bindgen = "=0.57.1"
# WASI for trusted packet mods only, pinned with wasmtime.
wasmtime-wasi = { version = "=36.0.16", default-features = false, features = ["preview1"] }
wasi-preview1-component-adapter-provider = "=36.0.16"
wit-component = "=0.247.0"


# Keep Metal display-link delivery, bounded submissions and indirect validation on wgpu 30.0.1,
# plus naga GLSL frontend fixes for Java shader packs: constant `?:` and indexing,
# missing returns, scalar swizzles, atomics and barriers, SPIR-V `fma` NoContraction.
# A lost device is a `PollError` instead of a poll panic, and queue-write staging OOM is recoverable.
# FXC (DX12) gets `[loop]` on loops with implicit-derivative operations instead of failing to unroll them.
# Every wgpu crate comes from the same rev so wgpu and the shaderpack crate share one naga.
[patch.crates-io]
tokio-websockets = { git = "https://github.com/cinnabar-mc/tokio-websockets", rev = "6f75363f1d892c42b853476dfba3d58e49e9d506" }
# Keep Linux crash dumps when a thread's stack cannot be read.
minidump-writer = { git = "https://github.com/cinnabar-mc/minidump-writer", rev = "389d34092fb3323f2253010615eda402212e534f" }
naga = { git = "https://github.com/cinnabar-mc/wgpu", rev = "de534fdc798c6a3850848faa702d9466ad7b89f7" }
wgpu = { git = "https://github.com/cinnabar-mc/wgpu", rev = "de534fdc798c6a3850848faa702d9466ad7b89f7" }
wgpu-core = { git = "https://github.com/cinnabar-mc/wgpu", rev = "de534fdc798c6a3850848faa702d9466ad7b89f7" }
wgpu-hal = { git = "https://github.com/cinnabar-mc/wgpu", rev = "de534fdc798c6a3850848faa702d9466ad7b89f7" }
wgpu-types = { git = "https://github.com/cinnabar-mc/wgpu", rev = "de534fdc798c6a3850848faa702d9466ad7b89f7" }


wgpu-naga-bridge = { git = "https://github.com/cinnabar-mc/wgpu", rev = "de534fdc798c6a3850848faa702d9466ad7b89f7" }

# Iris conditions support option expressions and recover malformed conditional directives.
pp-rs = { git = "https://github.com/cinnabar-mc/glslpp-rs", rev = "abbb47f83d69b8790c1a26c96ce68bc9d001664c" }

[profile.dev]
opt-level = 1
# Line tables keep backtraces and panics readable; full debuginfo made local builds 20-45% slower.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# Shipped binaries carry no debug info; line tables go to a split file per binary (a PDB on
# Windows, a `.dSYM` on macOS) that package.yml publishes as a release symbol archive. MSVC writes
# the PDB whatever `strip` says; macOS runs dsymutil before stripping. Linux packaging overrides
# split-debuginfo and strip and splits after linking (packaging/release-symbols.py), because the
# linker's `--strip-debug` would also drop the line tables a packed `.dwp` depends on.
[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "debuginfo"

# `make play`: release speed with parallel codegen and incremental rebuilds; shipped builds use release.
# It skips release debug info, so local and Android CI builds pay no dsymutil, PDB or link cost.
[profile.play]
inherits = "release"
codegen-units = 16
lto = false
incremental = true
debug = false

[workspace.lints.clippy]
# Diagnostics go through `tracing`; stdout/stderr contracts carry a reasoned `#[expect]`.
print_stderr = "warn"
print_stdout = "warn"

[package]
name = "experience-terminal-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
experience-sdk = { path = "../../../crates/experience-sdk", default-features = false, features = ["messages"] }
serde_json = "=1.0.150"

[features]
default = ["client"]
client = ["experience-sdk/client"]
server = ["experience-sdk/server"]

[build-dependencies]
experience-sdk = { path = "../../../crates/experience-sdk", default-features = false, features = ["project"] }

[lints]
workspace = true

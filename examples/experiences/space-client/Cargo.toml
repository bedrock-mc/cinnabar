[package]
name = "experience-space-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
experience-sdk = { path = "../../../crates/experience-sdk", default-features = false, features = ["client"] }
serde = { version = "=1.0.228", features = ["derive"] }

# The host tests' player mod: every `player-mod` callback, reporting what it saw through bound
# values. The tests fill [files], because the hashes depend on the build.
id = "probe"
version = "0.1.0"
api = "0.1"
permissions = ["screen", "items", "recipes", "keys"]
templates = ["ui/overlay.json", "ui/view.json"]
actions = ["probe.view", "probe.close", "probe.flood", "probe.search", "probe.read_all"]

[[keys]]
id = "probe.show"
key = "r"
label = "key.probe.show"

[[keys]]
id = "probe.trap"
key = "t"
label = "key.probe.trap"

[files]

[package]
name = "bootstrap-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["windows"]
reads = ["assets/panorama/*"]

[dependencies]
anyhow.workspace = true
assets = { path = "../assets" }
fontdue = { version = "0.9.3", default-features = false, features = ["std"] }
gilrs = "0.11.2"
image.workspace = true
launcher = { path = "../launcher" }
launcher-host = { path = "../launcher-host" }
render-model = { path = "../render-model" }
semantic-input = { path = "../input" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true
tracing.workspace = true
ui = { path = "../ui" }
wgpu.workspace = true
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "x11"] }

[dev-dependencies]
tempfile = "3"
test-time = { path = "../test-time" }

[lints]
workspace = true

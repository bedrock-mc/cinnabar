[package]
name = "update-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
doctest = false

[features]
# Derives TypeScript declarations for the launcher's web UI contract.
typescript = ["dep:ts-rs", "update-manifest/typescript"]

[dependencies]
anyhow.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror.workspace = true
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
tokio.workspace = true
tracing.workspace = true
ts-rs = { version = "=12.0.1", optional = true }
update-installer = { path = "../update-installer" }
update-manifest = { path = "../update-manifest" }

[dev-dependencies]
sha2.workspace = true

[lints]
workspace = true

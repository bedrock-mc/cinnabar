[package]
name = "first-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
assets = { path = "../assets" }
fontdue = { version = "0.9.3", default-features = false, features = ["std"] }
gilrs = "0.11.2"
image.workspace = true
launcher = { path = "../launcher" }
launcher-host = { path = "../launcher-host" }
render-model = { path = "../render-model" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
semantic-input = { path = "../input" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
tokio.workspace = true
ui = { path = "../ui" }
wgpu.workspace = true
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "x11"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "process", "std", "stdio"] }

[dev-dependencies]
launcher = { path = "../launcher", features = ["test-support"] }
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

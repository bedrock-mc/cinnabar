[package]
name = "first-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["windows"]
reads = ["assets/fonts/CinnanglesSans.ttf"]

[dependencies]
anyhow.workspace = true
assets = { path = "../assets" }
bootstrap-ui = { path = "../bootstrap-ui" }
diagnostics = { path = "../diagnostics" }
gilrs = "0.11.2"
launcher = { path = "../launcher" }
launcher-host = { path = "../launcher-host" }
render-model = { path = "../render-model" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
tokio.workspace = true
ui = { path = "../ui" }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "x11"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "process", "std", "stdio"] }

[dev-dependencies]
image.workspace = true
tempfile = "3"
test-time = { path = "../test-time" }
launcher = { path = "../launcher", features = ["test-support"] }
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

[package]
name = "gameplay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
reads = [
    "assets/bedrock-target.json",
    "crates/assets/data/*",
]

[features]
test-support = []

[dependencies]
web-time.workspace = true
protocol-ids = { path = "../protocol-ids" }
env-compat = { path = "../env-compat" }
simulation-clock = { path = "../simulation-clock" }
block-transform = { path = "../block-transform" }
assets = { path = "../assets" }
client-world = { path = "../client-world" }
actor-animation = { path = "../actor-animation" }
inventory = { path = "../inventory" }
player-state = { path = "../player-state" }
protocol = { path = "../protocol" }
render-api = { path = "../render-api" }
semantic-input = { path = "../input" }
sim = { path = "../sim" }
world = { path = "../world" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
meshing = { path = "../meshing" }
protocol = { path = "../protocol", features = ["test-support"] }

[lints]
workspace = true

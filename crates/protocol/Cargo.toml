[package]
name = "protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
# `tests/it` compiles into the library's unit tests, which may reach crate-private packet internals.
autotests = false

[package.metadata.cinnabar]
platform-specific = ["windows"]
reads = [
    "assets/block-data-sources.json",
    "tools/localserver/experience/testdata/protocol/limits.json",
    "tools/protocol-normalize/manifest.json",
]

[features]
# Fixture builders and semantic observations for other crates' tests.
test-support = []

[dependencies]
async-platform = { path = "../async-platform" }
web-time.workspace = true
simulation-clock = { path = "../simulation-clock" }
zeroize = "1"
block-transform = { path = "../block-transform" }
render-api = { path = "../render-api" }
anyhow.workspace = true
base64 = "0.22"
bridge = { path = "../bridge" }
bytes.workspace = true
futures.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
xxhash-rust = { version = "0.8.15", features = ["xxh64"] }
valentine = { path = "vendor/valentine", default-features = false, features = ["bedrock_1_26_51"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-std = "3.4.5"
cap-fs-ext = "3.4.5"
tokio = { workspace = true, features = ["fs", "net", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
tempfile = "3"
test-time = { path = "../test-time" }

[lints]
workspace = true

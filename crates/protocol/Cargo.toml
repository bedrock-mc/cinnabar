[package]
name = "protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
# Wire tests share one explicit integration target.
autotests = false

[package.metadata.cinnabar]
platform-specific = ["windows"]
reads = [
    "assets/bedrock-target.json",
    "assets/block-data-sources.json",
    "tools/localserver/experience/testdata/protocol/limits.json",
]

[features]
# Fixture builders and semantic observations for other crates' tests.
test-support = []

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
simulation-clock = { path = "../simulation-clock" }
zeroize = "1"
cap-std = "3.4.5"
cap-fs-ext = "3.4.5"
block-transform = { path = "../block-transform" }
render-api = { path = "../render-api" }
anyhow.workspace = true
base64 = "0.22"
bridge = { path = "../bridge" }
bytes.workspace = true
futures.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
xxhash-rust.workspace = true
bedrock-protocol-1-26-51 = { path = "vendor/bedrock-protocol-1-26-51" }

[dev-dependencies]
test-alloc = { path = "../test-alloc" }
tempfile = "3"
test-time = { path = "../test-time" }

[lints]
workspace = true

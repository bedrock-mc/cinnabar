[package]
name = "launcher-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["macos", "windows"]
reads = [
    "assets/bedrock-target.json",
]

[features]
test-support = []

[dependencies]
anyhow.workspace = true
web-time.workspace = true
bridge = { path = "../bridge" }
crossbeam-channel = "0.5"
launcher = { path = "../launcher" }
protocol = { path = "../protocol" }
tempfile = "3"
bytes.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
server-experience = { path = "../server-experience" }
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
update-manifest = { path = "../update-manifest" }
url = "2"
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctrlc = { version = "3.4", features = ["termination"] }
getrandom = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Crypto", "Storage", "Window"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "process", "std", "stdio"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-io = "2"
futures-lite = "2"
zbus = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
test-time = { path = "../test-time" }
launcher = { path = "../launcher", features = ["test-support"] }

[lints]
workspace = true

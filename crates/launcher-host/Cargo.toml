[package]
name = "launcher-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["macos", "windows"]
reads = [
    "assets/bedrock-target.json",
    "core",
    "packaging/android/runtime.json",
]

[features]
test-support = []

[dependencies]
cosmetics = { path = "../cosmetics" }
anyhow.workspace = true
bridge = { path = "../bridge" }
crash-handler = "0.8.1"
crash-report = { path = "../crash-report" }
crossbeam-channel = "0.5"
ctrlc = { version = "3.4", features = ["termination"] }
launcher = { path = "../launcher" }
memmap2 = "0.9"
minidumper = "0.11"
resource-pack = { path = "../resource-pack" }
getrandom = "0.3"
protocol = { path = "../protocol" }
render-api = { path = "../render-api" }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
server-experience = { path = "../server-experience" }
sha2.workspace = true
thiserror.workspace = true
time = { version = "0.3", default-features = false, features = ["std"] }
tokio.workspace = true
tracing.workspace = true
update-installer = { path = "../update-installer" }
update-manifest = { path = "../update-manifest" }
url = "2"
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", default-features = false, features = ["fs", "process", "std", "stdio"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
async-io = "2"
futures-lite = "2"
zbus = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
test-time = { path = "../test-time" }
launcher = { path = "../launcher", features = ["test-support"] }


[lints]
workspace = true

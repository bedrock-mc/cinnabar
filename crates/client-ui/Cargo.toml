[package]
name = "client-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["macos"]
reads = [
    "assets/branding/title.png",
    "assets/cinnangles-sans-source.json",
    "assets/java-hud/ui/*",
    "crates/protocol/fixtures/*",
]

[features]
test-support = []
tracy = []

[dependencies]
launcher-host = { path = "../launcher-host" }
bridge = { path = "../bridge" }
anyhow.workspace = true
arboard = { version = "3", default-features = false }
assets = { path = "../assets" }
chunk-pipeline = { path = "../chunk-pipeline" }
client-world = { path = "../client-world" }
glam.workspace = true
actor-animation = { path = "../actor-animation" }
render-api = { path = "../render-api" }
render-model = { path = "../render-model" }
player-state = { path = "../player-state" }
launcher = { path = "../launcher" }
inventory = { path = "../inventory" }
json-ui = { path = "../json-ui" }
protocol = { path = "../protocol" }
semantic-input = { path = "../input" }
ui = { path = "../ui" }
world = { path = "../world" }
server-experience = { path = "../server-experience" }
image.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
crossbeam-channel = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
rayon.workspace = true
tokio.workspace = true
resource-pack = { path = "../resource-pack" }

[dev-dependencies]
launcher-host = { path = "../launcher-host", features = ["test-support"] }
test-time = { path = "../test-time" }
tempfile = "3"
protocol = { path = "../protocol", features = ["test-support"] }
mod-host = { path = "../mod-host" }
pack-compiler = { path = "../pack-compiler" }
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

[package]
name = "client-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
reads = [
    "crates/mod-api/wit/extension.wit",
    "crates/mod-host/src/packet_mod/tests/guest.wat",
    "crates/mod-host/src/tests/hud.wat",
]

[dependencies]
anyhow.workspace = true
bedrock-packs.workspace = true
assets = { path = "../assets" }
bevy.workspace = true
client-state = { path = "../client-state" }
client-ui = { path = "../client-ui" }
client-world = { path = "../client-world" }
fontdue = { version = "0.9.3", default-features = false, features = ["std"] }
inventory = { path = "../inventory" }
mod-api = { path = "../mod-api" }
mod-host = { path = "../mod-host" }
mod-render = { path = "../mod-render" }
player-state = { path = "../player-state" }
protocol = { path = "../protocol" }
render-model = { path = "../render-model" }
render-api = { path = "../render-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
server-experience = { path = "../server-experience" }
ui = { path = "../ui" }
sha2 = { workspace = true }
tracing.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

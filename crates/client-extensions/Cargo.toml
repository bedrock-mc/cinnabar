[package]
name = "client-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
reads = [
    "crates/mod-api/wit/extension.wit",
]

[features]
local-mods = ["mod-host/execution", "dep:mod-api", "dep:mod-render", "dep:fontdue", "dep:sha2"]

[dependencies]
anyhow.workspace = true
assets = { path = "../assets" }
bevy.workspace = true
client-state = { path = "../client-state" }
client-ui = { path = "../client-ui" }
client-world = { path = "../client-world" }
fontdue = { version = "0.9.3", default-features = false, features = ["std"], optional = true }
inventory = { path = "../inventory" }
mod-api = { path = "../mod-api", optional = true }
mod-host = { path = "../mod-host", default-features = false }
mod-render = { path = "../mod-render", optional = true }
player-state = { path = "../player-state" }
protocol = { path = "../protocol" }
render-model = { path = "../render-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
server-experience = { path = "../server-experience" }
ui = { path = "../ui" }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

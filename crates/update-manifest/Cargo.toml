[package]
name = "update-manifest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
reads = ["packaging/release-assets.json"]

[lib]
doctest = false

[features]
# Derives TypeScript declarations for the launcher's web UI contract.
typescript = ["dep:ts-rs"]

[dependencies]
base64 = "0.22"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
thiserror.workspace = true
ts-rs = { version = "=12.0.1", optional = true }
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing"] }
url = "2"

[lints]
workspace = true

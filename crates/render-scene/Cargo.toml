[package]
name = "render-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# Counts allocation requests and labelled GPU writes for diagnostic runs.
alloc-stats = ["dep:test-alloc", "test-alloc/global-stats"]
publication-test-support = []
enhanced-diagnostics = ["render-model/enhanced-diagnostics"]
tracy = ["dep:tracy-client"]

[dependencies]
web-time.workspace = true
test-alloc = { path = "../test-alloc", optional = true }
env-compat = { path = "../env-compat" }
simulation-clock = { path = "../simulation-clock" }
assets = { path = "../assets" }
bevy.workspace = true
bytemuck = { version = "1", features = ["derive"] }
far-terrain = { path = "../far-terrain" }
glam.workspace = true
meshing = { path = "../meshing" }
mod-api = { path = "../mod-api" }
mod-render = { path = "../mod-render" }
particles = { path = "../particles" }
render-api = { path = "../render-api" }
render-model = { path = "../render-model" }
serde = "1"
serde_json = "1"
sha2.workspace = true
world = { path = "../world" }
tracy-client = { version = "=0.19.0", default-features = false, features = ["enable", "only-localhost", "ondemand"], optional = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
test-alloc = { path = "../test-alloc", features = ["global-stats"] }
tempfile = "3"
test-time = { path = "../test-time" }

[lints]
workspace = true

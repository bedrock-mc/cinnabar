[package]
name = "crash-report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["macos", "windows"]
# The Go core's embedded copy of `data/redaction-rules.json`, checked byte-for-byte.
reads = ["core/internal/redact/rules.json"]

[lib]
doctest = false

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"
windows-sys = { workspace = true, features = ["Win32_Foundation"] }

[lints]
workspace = true

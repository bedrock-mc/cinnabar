[package]
name = "crash-report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["macos"]
# The Go core's embedded copy of `data/redaction-rules.json`, checked byte-for-byte.
reads = ["core/internal/redact/rules.json"]

[lib]
doctest = false

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

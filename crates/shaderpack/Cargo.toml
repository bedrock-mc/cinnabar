[package]
name = "shaderpack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["macos"]

[lib]
doctest = false

[dependencies]
assets = { path = "../assets" }
naga.workspace = true
pp-rs = "0.2.1"
rayon.workspace = true
serde_json = "1"
zip-footer = { path = "../zip-footer" }
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

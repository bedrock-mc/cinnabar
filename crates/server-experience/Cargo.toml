[package]
name = "server-experience"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
developer-media = ["dep:matroska-demuxer", "dep:dav1d", "dep:opus"]

[dependencies]
anyhow.workspace = true
protocol = { path = "../protocol" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
ring = "=0.17.14"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2.workspace = true
tokio.workspace = true
url = "=2.5.8"
zip = { version = "=7.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
matroska-demuxer = { version = "=0.8.1", optional = true }
dav1d = { version = "=0.11.1", optional = true }
opus = { version = "=0.4.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[package]
name = "client-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
local-mods = []
test-support = ["client-session/test-support"]

[dependencies]
anyhow.workspace = true
bevy.workspace = true
bridge = { path = "../bridge" }
web-time.workspace = true
async-platform = { path = "../async-platform" }
chunk-pipeline = { path = "../chunk-pipeline" }
client-session = { path = "../client-session" }
client-state = { path = "../client-state" }
client-ui = { path = "../client-ui" }
client-world = { path = "../client-world" }
diagnostics = { path = "../diagnostics" }
launcher-host = { path = "../launcher-host" }
meshing = { path = "../meshing" }
pack-runtime = { path = "../pack-runtime" }
protocol = { path = "../protocol" }
render = { path = "../render" }
render-scene = { path = "../render-scene" }
render-api = { path = "../render-api" }
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Location", "Window"] }

[dev-dependencies]
client-session = { path = "../client-session", features = ["test-support"] }

[lints]
workspace = true

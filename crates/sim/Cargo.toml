[package]
name = "sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
reads = [
    "assets/block-projection-v2193.json",
    "crates/assets/data/block-physics-v2193.bin",
    "tools/bedsimtrace-controls/*",
    "tools/bedsimtrace-v0.1.4/*",
    "tools/bedsimtrace-v0.1.5/*",
    "tools/bedsimtrace/*",
]

[dependencies]
assets = { path = "../assets" }
block-transform = { path = "../block-transform" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true
world = { path = "../world" }

[lints]
workspace = true

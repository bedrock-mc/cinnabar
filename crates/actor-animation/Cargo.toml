[package]
name = "actor-animation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# Fixtures and budget controls for actor authority's animation integration tests.
test-support = ["cosmetics/test-support"]

[dependencies]
cosmetics = { path = "../cosmetics" }
protocol-ids = { path = "../protocol-ids" }
simulation-clock = { path = "../simulation-clock" }
assets = { path = "../assets" }
protocol = { path = "../protocol" }
rayon.workspace = true
render-api = { path = "../render-api" }
render-model = { path = "../render-model" }
sha2.workspace = true
tracing.workspace = true
world = { path = "../world" }

[dev-dependencies]
criterion.workspace = true
cosmetics = { path = "../cosmetics", features = ["test-support"] }
assets = { path = "../assets", features = ["test-support"] }

[lints]
workspace = true

[[bench]]
name = "actor_costs"
harness = false
required-features = ["test-support"]

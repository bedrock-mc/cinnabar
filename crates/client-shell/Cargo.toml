[package]
name = "client-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
developer-control = ["dep:developer-control"]
test-support = ["launcher/test-support", "launcher-host/test-support"]

[dependencies]
bevy.workspace = true
image.workspace = true
sha2.workspace = true
tokio.workspace = true
wgpu.workspace = true
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
developer-control = { path = "../developer-control", optional = true }
assets = { path = "../assets" }
bridge = { path = "../bridge" }
chunk-pipeline = { path = "../chunk-pipeline" }
client-session = { path = "../client-session" }
client-state = { path = "../client-state" }
client-ui = { path = "../client-ui" }
json-ui = { path = "../json-ui" }
launcher = { path = "../launcher" }
launcher-host = { path = "../launcher-host" }
pack-runtime = { path = "../pack-runtime" }
protocol = { path = "../protocol" }
render-scene = { path = "../render-scene" }
render-api = { path = "../render-api" }
render-model = { path = "../render-model" }
resource-pack = { path = "../resource-pack" }
rich-presence = { path = "../rich-presence" }
semantic-input = { path = "../input" }
server-experience = { path = "../server-experience" }
ui = { path = "../ui" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ash = "0.38"

[dev-dependencies]
launcher = { path = "../launcher", features = ["test-support"] }
launcher-host = { path = "../launcher-host", features = ["test-support"] }
client-ui = { path = "../client-ui", features = ["test-support"] }
client-world = { path = "../client-world" }
player-state = { path = "../player-state" }
protocol = { path = "../protocol", features = ["wire-test-support"] }
test-time = { path = "../test-time" }
tempfile = "3"
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

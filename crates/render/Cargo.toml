[package]
name = "render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
publication-test-support = ["wgpu/noop"]

[dependencies]
mod-api = { path = "../mod-api" }
assets = { path = "../assets" }
bevy = { workspace = true, default-features = false, features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_log",
    "bevy_mesh",
    "bevy_render",
    "bevy_shader",
    "multi_threaded",
    "std",
] }
bytemuck = { version = "1", features = ["derive"] }
client-world = { path = "../client-world" }
meshing = { path = "../meshing" }
rayon.workspace = true
serde_json = "1"
sha2.workspace = true
world = { path = "../world" }
wgpu = { version = "27.0.1", default-features = false }

# ARM hardware dispatch keeps identical digests and falls back on CPUs without SHA2.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
bevy = { workspace = true, features = ["bevy_window", "bevy_post_process"] }
asset-compiler = { path = "../asset-compiler" }
image = { version = "0.25", default-features = false, features = ["png"] }
naga = { version = "27.0.3", features = ["wgsl-in", "wgsl-out"] }
naga_oil = "0.20"
tempfile = "3"
wgpu = { version = "27.0.1", default-features = false, features = ["noop"] }

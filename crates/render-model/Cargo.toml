[package]
name = "render-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
enhanced = []

[dependencies]
assets = { path = "../assets" }
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30.10", default-features = false, features = ["std"] }
render-api = { path = "../render-api" }
sha2.workspace = true
world = { path = "../world" }

# ARM hardware dispatch keeps identical digests and falls back on CPUs without SHA2.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
pack-compiler = { path = "../pack-compiler" }
serde_json = "1"
tempfile = "3"

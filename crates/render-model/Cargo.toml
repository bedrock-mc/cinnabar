[package]
name = "render-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
enhanced-diagnostics = []

[dependencies]
assets = { path = "../assets" }
bytemuck = { version = "1", features = ["derive"] }
glam.workspace = true
render-api = { path = "../render-api" }
sha2.workspace = true
world = { path = "../world" }

# ARM hardware dispatch keeps identical digests and falls back on CPUs without SHA2.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
image.workspace = true
pack-compiler = { path = "../pack-compiler" }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true

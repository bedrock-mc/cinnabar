[package]
name = "json-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.cinnabar]
reads = [
    "assets/java-hud",
    "assets/vanilla-source.json",
]

[lib]
name = "json_ui"
path = "src/lib.rs"

[dependencies]
pack-json = { path = "../pack-json" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror.workspace = true

[dev-dependencies]
test-alloc = { path = "../test-alloc" }

[lints]
workspace = true

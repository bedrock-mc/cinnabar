[package]
name = "oreui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
test-support = ["dep:render-api"]
tracy = ["dep:tracing"]

[dependencies]
assets = { path = "../assets" }
bridge = { path = "../bridge" }
image.workspace = true
launcher = { path = "../launcher" }
protocol = { path = "../protocol" }
render-api = { path = "../render-api", optional = true }
render-model = { path = "../render-model" }
resource-pack = { path = "../resource-pack", default-features = false }
semantic-input = { path = "../input" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { workspace = true, optional = true }
ui = { path = "../ui" }
ui-engine = { path = "../ui-engine" }

[dev-dependencies]
test-alloc = { path = "../test-alloc" }
render-api = { path = "../render-api" }
tempfile = "3"
ui-engine = { path = "../ui-engine", features = ["test-support"] }

[lints]
workspace = true

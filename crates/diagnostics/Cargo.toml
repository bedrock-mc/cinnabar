[package]
name = "diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
assets = { path = "../assets" }
bevy.workspace = true
chunk-pipeline = { path = "../chunk-pipeline" }
meshing = { path = "../meshing" }
protocol = { path = "../protocol" }
render-model = { path = "../render-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
world = { path = "../world" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "stdio", "pipe"] }

[target.'cfg(windows)'.dependencies]
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Pipes"] }

[dev-dependencies]
client-ui = { path = "../client-ui" }

[lints]
workspace = true

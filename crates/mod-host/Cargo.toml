[package]
name = "mod-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["windows"]
reads = [
    "crates/mod-api/native-render-v1.json",
    "crates/experience-sdk/wit/client",
    "crates/experience-sdk/wit/session",
    "crates/mod-api/wit",
    "crates/server-experience/src/media/testdata/fixture.webm",
    "examples/mods/screen-probe",
]

[features]
# Links the native AV1/Opus decoders into the memory-limited media helper.
media = ["server-experience/developer-media"]

[[bin]]
name = "mod-host"
path = "src/main.rs"

[[bin]]
name = "cinnabar-media-helper"
path = "src/bin/media_helper.rs"

[dependencies]
assets = { path = "../assets" }
experience-sdk = { path = "../experience-sdk", default-features = false, features = ["declarations"] }
mod-api = { path = "../mod-api" }
mod-render = { path = "../mod-render" }
render-api = { path = "../render-api" }
ui = { path = "../ui" }
anyhow.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
png = "0.18"
sha2 = { workspace = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
server-experience = { path = "../server-experience" }
wasmtime = { workspace = true, features = ["call-hook"] }
wasmtime-wasi = { workspace = true }
wasi-preview1-component-adapter-provider = { workspace = true }
tracing.workspace = true
bytes.workspace = true
tokio.workspace = true
wit-component = { workspace = true }
wasmparser = { version = "=0.247.0" }
wit-parser = "=0.247.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[dev-dependencies]
criterion.workspace = true
test-alloc = { path = "../test-alloc" }
test-time = { path = "../test-time" }
tempfile = "3"
wasm-metadata = { version = "=0.247.0", default-features = false }
wat = "1"
wit-parser = "=0.247.0"

[[bench]]
name = "terrain_lowering"
harness = false

[lints]
workspace = true

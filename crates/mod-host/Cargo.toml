[package]
name = "mod-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["execution"]
# The Wasmtime component host (local mods and the server helper); clients spawning helpers opt out.
execution = [
    "dep:experience-sdk",
    "dep:mod-api",
    "dep:mod-render",
    "dep:sha2",
    "dep:ui",
    "dep:wasmtime",
    "dep:wit-component",
]
# Links the native AV1/Opus decoders into the memory-limited media helper.
media = ["server-experience/developer-media"]

[[bin]]
name = "mod-host"
path = "src/main.rs"
required-features = ["execution"]

[[bin]]
name = "cinnabar-media-helper"
path = "src/bin/media_helper.rs"

[dependencies]
experience-sdk = { path = "../experience-sdk", default-features = false, features = ["declarations"], optional = true }
mod-api = { path = "../mod-api", optional = true }
mod-render = { path = "../mod-render", optional = true }
ui = { path = "../ui", optional = true }
anyhow.workspace = true
sha2 = { workspace = true, optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
server-experience = { path = "../server-experience" }
wasmtime = { workspace = true, optional = true }
wit-component = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
wat = "1"

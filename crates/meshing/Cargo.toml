[package]
name = "meshing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
reads = [
    "assets/bedrock-target.json",
    "crates/assets/data/*",
    "crates/render/src/model.wesl",
]

[dependencies]
block-transform = { path = "../block-transform" }
assets = { path = "../assets" }
bytemuck = { version = "1", features = ["derive"] }
world = { path = "../world" }

[dev-dependencies]
criterion.workspace = true
pack-compiler = { path = "../pack-compiler" }
image.workspace = true
serde_json = "1"
tempfile = "3"

[[bench]]
name = "chunk_costs"
harness = false

[[bench]]
name = "entity_occlusion"
harness = false

[lints]
workspace = true

[package]
name = "bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["macos", "windows"]
reads = [
    "core",
]

[dependencies]
web-time.workspace = true
anyhow.workspace = true
async-platform = { path = "../async-platform" }
bytes.workspace = true
sha2.workspace = true
futures.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["net", "process", "std"] }

[target.'cfg(windows)'.dependencies]
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["fs", "net", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
send_wrapper = "0.6"
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["BinaryType", "CloseEvent", "Event", "MessageEvent", "Storage", "WebSocket", "Window"] }

[dev-dependencies]
test-time = { path = "../test-time" }
tempfile = "3"

[lints]
workspace = true

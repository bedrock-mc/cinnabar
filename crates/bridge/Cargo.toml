[package]
name = "bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["macos", "windows"]
reads = [
    "assets/bedrock-target.json",
    "core",
]

[features]
join-profile = []

[dependencies]
web-time.workspace = true
anyhow.workspace = true
bytes.workspace = true
sha2.workspace = true
futures.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
subtle = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["net", "process", "std"] }

[target.'cfg(windows)'.dependencies]
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["fs", "net", "rt-multi-thread"] }

[dev-dependencies]
test-time = { path = "../test-time" }
tempfile = "3"

[lints]
workspace = true

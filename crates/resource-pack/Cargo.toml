[package]
name = "resource-pack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["handoff"]
handoff = ["dep:protocol"]
test-support = ["handoff"]

[dependencies]
pack-json = { path = "../pack-json" }
rayon.workspace = true
aes = "0.9.3"
protocol = { path = "../protocol", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["serde"] }
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zeroize = "1"
zip-footer = { path = "../zip-footer" }

[dev-dependencies]
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

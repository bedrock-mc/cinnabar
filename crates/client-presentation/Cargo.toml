[package]
name = "client-presentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
reads = [
    "assets/bedrock-target.json",
    "assets/vanilla-source.json",
]

[features]
test-support = []

[dependencies]
cosmetics = { path = "../cosmetics" }
protocol-ids = { path = "../protocol-ids" }
simulation-clock = { path = "../simulation-clock" }
anyhow.workspace = true
assets = { path = "../assets" }
bevy.workspace = true
glam.workspace = true
chunk-pipeline = { path = "../chunk-pipeline" }
client-world = { path = "../client-world" }
actor-animation = { path = "../actor-animation" }
client-ui = { path = "../client-ui" }
diagnostics = { path = "../diagnostics" }
inventory = { path = "../inventory" }
launcher = { path = "../launcher" }
player-state = { path = "../player-state" }
protocol = { path = "../protocol" }
render-scene = { path = "../render-scene" }
render-api = { path = "../render-api" }
render-model = { path = "../render-model" }
resource-pack = { path = "../resource-pack" }
semantic-input = { path = "../input" }
sim = { path = "../sim" }
ui = { path = "../ui" }
world = { path = "../world" }
meshing = { path = "../meshing" }
image.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
render-model = { path = "../render-model", features = ["test-support"] }
assets = { path = "../assets", features = ["test-support"] }
actor-animation = { path = "../actor-animation", features = ["test-support"] }
protocol = { path = "../protocol", features = ["test-support"] }
test-time = { path = "../test-time" }
test-alloc = { path = "../test-alloc" }
tempfile = "3"
render-scene = { path = "../render-scene", features = ["publication-test-support"] }
client-ui = { path = "../client-ui", features = ["test-support"] }
ui-engine = { path = "../ui-engine", features = ["test-support"] }
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
pack-compiler = { path = "../pack-compiler" }
pack-entity-compiler = { path = "../pack-compiler/entity" }
chunk-pipeline = { path = "../chunk-pipeline", features = ["publication-test-support"] }

[lints]
workspace = true

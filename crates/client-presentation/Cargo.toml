[package]
name = "client-presentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
test-support = []

[dependencies]
server-experience = { path = "../server-experience" }
crossbeam-queue = "=0.3.13"
anyhow.workspace = true
assets = { path = "../assets" }
bevy.workspace = true
chunk-pipeline = { path = "../chunk-pipeline" }
client-world = { path = "../client-world" }
client-ui = { path = "../client-ui" }
inventory = { path = "../inventory" }
launcher = { path = "../launcher" }
player-state = { path = "../player-state" }
protocol = { path = "../protocol" }
render = { path = "../render" }
render-api = { path = "../render-api" }
resource-pack = { path = "../resource-pack" }
semantic-input = { path = "../input" }
sim = { path = "../sim" }
ui = { path = "../ui" }
world = { path = "../world" }
meshing = { path = "../meshing" }
image.workspace = true
rodio = { version = "=0.20.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
pack-compiler = { path = "../pack-compiler" }
chunk-pipeline = { path = "../chunk-pipeline", features = ["publication-test-support"] }
render = { path = "../render", features = ["publication-test-support"] }

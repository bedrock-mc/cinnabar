[package]
name = "asset-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["windows"]
reads = [
    ".gitattributes",
    "Cargo.lock",
    "assets/bedrock-target.json",
    "assets/block-projection-v2193.json",
    "assets/biome-projection-v2193.json",
    "tools/registrygen",
    "crates/protocol/data/retail_items_1_26_50.tsv",
    "crates/protocol/data/retail_actors_1_26_50.txt",
    "crates/protocol/data/retail_biomes_1_26_50.txt",
    "crates/protocol/data/item_tags_native.tsv",
    "assets/cinnangles-sans-source.json",
    "assets/fonts/CinnanglesSans.ttf",
    "assets/hud-source-v2193.json",
    "assets/licenses/GeyserMC-Geyser-MIT.txt",
    "assets/licenses/GeyserMC-mappings-MIT.txt",
    "assets/licenses/Monocraft-OFL-1.1.txt",
    "assets/licenses/NotoSansCJK-OFL-1.1.txt",
    "assets/ui-font-source.json",
    "assets/vanilla-source.json",
    "crates/assets/data/*",
    "crates/assets/src/facts/identities_generated.rs",
    "crates/assets/tests/fixtures/registry-wire.hex",
    "crates/json-ui/data/vanilla-ui-vocabulary-1.26.50.txt",
    "packaging/common/prep-kit-files.txt",
]

[dependencies]
shaderpack = { path = "../shaderpack", optional = true }
protocol-ids = { path = "../protocol-ids" }
world = { path = "../world" }
assets = { path = "../assets" }
block-transform = { path = "../block-transform" }
pack-compile-input = { path = "../pack-compiler/input" }
pack-compiler = { path = "../pack-compiler" }
pack-entity-compiler = { path = "../pack-compiler/entity" }
pack-font-compiler = { path = "../pack-compiler/font" }
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
tempfile = "3"
tokio.workspace = true
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
image.workspace = true

[lints]
workspace = true

[features]
shaderpacks = ["dep:shaderpack"]

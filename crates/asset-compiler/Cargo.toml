[package]
name = "asset-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
assets = { path = "../assets" }
pack-compiler = { path = "../pack-compiler" }
clap = { version = "4", features = ["derive"] }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
tempfile = "3"

[dev-dependencies]
image.workspace = true

[package]
name = "asset-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["windows"]
reads = [
    ".gitattributes",
    "Cargo.lock",
    "assets/bedrock-target.json",
    "assets/cinnangles-sans-source.json",
    "assets/fonts/CinnanglesSans.ttf",
    "assets/hud-source-v2193.json",
    "assets/licenses/Monocraft-OFL-1.1.txt",
    "assets/licenses/NotoSansCJK-OFL-1.1.txt",
    "assets/ui-font-source.json",
    "assets/vanilla-source.json",
    "crates/assets/data/*",
    "packaging/common/prep-kit-files.txt",
]

[dependencies]
world = { path = "../world" }
assets = { path = "../assets" }
block-transform = { path = "../block-transform" }
pack-compiler = { path = "../pack-compiler" }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
tempfile = "3"
tokio.workspace = true

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
image.workspace = true

[lints]
workspace = true

[package]
name = "chunk-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["macos", "windows"]
reads = [
    "crates/world/fixtures/uniform_non_air.bin",
]

[features]
tracy = []
publication-test-support = []
benchmark-support = []
# Bench binaries use an uninstrumented allocator and the requested Criterion sample count.
runtime-profile = []
benchmark-mimalloc = ["runtime-profile"]

[dependencies]
simulation-clock = { path = "../simulation-clock" }
render-api = { path = "../render-api" }
assets = { path = "../assets" }
crossbeam-channel = "0.5"
bytes.workspace = true
hashbrown = "0.16"
meshing = { path = "../meshing" }
client-world = { path = "../client-world" }
# Distant terrain sampling, merging and its store client.
lod = { path = "../lod" }
lod-store = { path = "../lod-store" }
actor-animation = { path = "../actor-animation" }
rayon.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
world = { path = "../world" }
# Distant terrain chunk content hashes.
xxhash-rust.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
mimalloc.workspace = true
test-alloc = { path = "../test-alloc" }
test-time = { path = "../test-time" }
serde_json = "1"
protocol = { path = "../protocol" }
criterion.workspace = true
tempfile = "3"
# Pauses the store thread so tests can fill its queue.
lod-store = { path = "../lod-store", features = ["test-support"] }

[[bench]]
name = "chunk_costs"
harness = false
required-features = ["benchmark-support"]

[[bench]]
name = "flight_costs"
harness = false
required-features = ["benchmark-support"]

[lints]
workspace = true

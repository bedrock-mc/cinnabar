[package]
name = "pack-font-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["macos", "windows"]
reads = ["assets/fonts", "assets/ui-font-source.json"]

[dependencies]
assets = { path = "../../assets" }
fontdue = { version = "0.9.3", default-features = false, features = ["std"] }
image.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Outline glyphs use the portable bundled build.
freetype-sys = { version = "=0.22.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

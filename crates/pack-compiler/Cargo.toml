[package]
name = "pack-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["windows"]
reads = [
    "assets/bedrock-target.json",
    "assets/vanilla-source.json",
    "crates/assets/data/*",
]

[dependencies]
pack-compile-input = { path = "input" }
bedrock-packs.workspace = true
assets = { path = "../assets" }
image.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-fs-ext = "3.4.5"
cap-std = "3.4.5"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

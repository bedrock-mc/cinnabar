[package]
name = "pack-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
assets = { path = "../assets" }
cap-fs-ext = "3.4.5"
cap-std = "3.4.5"
fontdue = { version = "0.9.3", default-features = false, features = ["std"] }
# Outline glyphs need no embedded PNG support; use the portable bundled build.
freetype-sys = { version = "=0.22.0", features = ["bundled"] }
ttf-parser = { version = "0.21.1", default-features = false, features = ["std", "opentype-layout"] }
image.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"

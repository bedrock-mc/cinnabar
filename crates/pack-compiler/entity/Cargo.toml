[package]
name = "pack-entity-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["windows"]
reads = ["assets/bedrock-target.json", "assets/vanilla-source.json", "crates/assets/data/*", "crates/protocol/data/retail_items_1_26_50.tsv"]

[dependencies]
pack-compile-input = { path = "../input" }
pack-json = { path = "../../pack-json" }
assets = { path = "../../assets" }
simulation-clock = { path = "../../simulation-clock" }
image.workspace = true
rayon.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true

[dev-dependencies]
pack-compiler = { path = ".." }
tempfile = "3"

[lints]
workspace = true

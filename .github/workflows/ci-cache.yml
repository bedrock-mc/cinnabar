name: CI cache

# Saves dev's Linux Rust and Go caches, the base every pull request restores from, and tests dev on
# Linux so direct pushes that break it are flagged on the commit that did it. Windows and macOS
# caches come from ci.yml's full runs on dev; this dispatches one when their inputs change.
# Runs at most hourly, and only when dev has changed since the last run.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# Queue rather than cancel: a cancelled run saves nothing.
concurrency:
  group: ci-cache-${{ github.ref }}
  cancel-in-progress: false

# Must match ci.yml so compiler outputs can be reused.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

permissions:
  actions: read
  contents: read

jobs:
  changed:
    name: Check for new dev commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
      deps: ${{ steps.check.outputs.deps }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          last=$(gh api "repos/$REPO/actions/workflows/ci-cache.yml/runs?branch=dev&status=success&per_page=20" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID)][0].head_sha // \"\"")
          run=false deps=false
          if [ "$EVENT" = workflow_dispatch ] || [ "$last" != "$SHA" ]; then run=true; fi
          # Inputs to the Windows and macOS cache keys: lockfiles, toolchain and these workflows.
          # An unknown or unreachable last commit counts as changed.
          if [ "$run" = true ]; then
            files=Cargo.lock
            if [ -n "$last" ]; then
              files=$(gh api --paginate "repos/$REPO/compare/$last...$SHA?per_page=100" --jq '.files[].filename') || files=Cargo.lock
            fi
            if grep -qE '^(Cargo\.lock|rust-toolchain\.toml|(.*/)?go\.(sum|work\.sum)|\.github/workflows/ci(-cache)?\.yml|\.github/actions/.*)$' <<<"$files"; then
              deps=true
            fi
          fi
          { echo "run=$run"; echo "deps=$deps"; } >> "$GITHUB_OUTPUT"

  full:
    name: Dispatch full CI on dev
    needs: changed
    if: needs.changed.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: gh workflow run ci.yml --repo "$REPO" --ref "$REF"

  linux:
    permissions:
      contents: read
      actions: write
    needs: changed
    if: needs.changed.outputs.run == 'true'
    name: Warm and test Linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - name: Restore Rust build cache
        id: rust-cache
        uses: ./.github/actions/build-cache
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Restore Go build cache
        id: go-cache
        uses: ./.github/actions/build-cache
        with:
          language: go
      - name: Warm Go caches
        run: |
          go build -trimpath -o "$RUNNER_TEMP/bedrock-core" ./core/cmd/bedrock-core
          go test -run '^$' ./core/...
          go -C tools/registrygen test -run '^$' ./...
          for module in chunkfix localserver bedsimtrace; do
            GOWORK=off go -C "tools/$module" test -run '^$' ./...
          done
      - name: Install Linux desktop development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev
      # Everything ci.yml's verify job compiles, so its dependencies are cached too.
      - run: cargo build -p architecture --locked
      - continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - continue-on-error: true
        run: |
          cargo clippy -p render --features enhanced --all-targets --locked -- -D warnings
          cargo clippy -p bedrock-client --features enhanced,local-mods,developer-control,tracy --locked -- -D warnings
          cargo clippy -p bedrock-client --features reports --tests --locked -- -D warnings
      - continue-on-error: true
        run: cargo test -p bedrock-client --features local-mods,developer-control --lib --locked --no-run
      - name: Test Rust workspace
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: Test Rust doc examples
        run: cargo test --doc --workspace --locked
      - name: Save Rust build cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/dev' }}
        uses: ./.github/actions/build-cache
        with:
          phase: save
          key: ${{ steps.rust-cache.outputs.key }}
          bucket: ${{ steps.rust-cache.outputs.bucket }}
          paths: ${{ steps.rust-cache.outputs.paths }}
      - name: Save Go build cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/dev' }}
        uses: ./.github/actions/build-cache
        with:
          phase: save
          language: go
          key: ${{ steps.go-cache.outputs.key }}
          bucket: ${{ steps.go-cache.outputs.bucket }}
          paths: ${{ steps.go-cache.outputs.paths }}

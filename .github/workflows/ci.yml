name: CI

# Pull requests run every Linux check plus a platform subset on Windows and macOS. Scheduled and
# manual runs are full: every test, clippy and Go check on all three OSes. `ci-ok` is the one
# required check; it passes when every job succeeded or was skipped by a path filter.
on:
  pull_request:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Verification needs assertions, but not large debug-symbol artifacts.
# Must match ci-cache.yml so compiler outputs can be reused.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      full: ${{ steps.plan.outputs.full }}
      os: ${{ steps.plan.outputs.os }}
      packaging: ${{ steps.plan.outputs.full == 'true' || steps.filter.outputs.packaging == 'true' }}
      physics: ${{ steps.plan.outputs.full == 'true' || steps.filter.outputs.physics == 'true' }}
      scripts: ${{ steps.plan.outputs.full == 'true' || steps.filter.outputs.scripts == 'true' }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          full=false run=true
          if [ "$EVENT" != pull_request ]; then full=true; fi
          # A scheduled run is skipped only when a full run already passed on this commit, so failed
          # or interrupted runs are retried.
          if [ "$EVENT" = schedule ]; then
            passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=50" \
              --jq "[.workflow_runs[] | select(.id != $RUN_ID and .event != \"pull_request\")] | length")
            if [ "$passed" -gt 0 ]; then run=false; fi
          fi
          if [ "$full" = true ]; then
            os='["ubuntu-latest","windows-latest","macos-latest"]'
          else
            os='["ubuntu-latest"]'
          fi
          { echo "full=$full"; echo "run=$run"; echo "os=$os"; } >> "$GITHUB_OUTPUT"
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            packaging:
              - .github/workflows/ci.yml
              - .github/workflows/package.yml
              - .github/actions/**
              - .github/tests/**
              - packaging/**
            physics:
              - .github/workflows/ci.yml
              - Makefile
              - assets/bedrock-target.json
              - crates/assets/data/block-physics-*
              - tools/registrygen/**
            scripts:
              - .github/workflows/ci.yml
              - scripts/**
              - assets/bedrock-target.json
              - assets/vanilla-source.json
              - core/go.mod

  verify:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - name: Restore Rust build cache
        id: rust-cache
        uses: ./.github/actions/build-cache
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: Install Linux desktop development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev
      - name: Verify Linux window backends
        run: |
          cargo tree -e features -p bedrock-client --target x86_64-unknown-linux-gnu --locked | grep -F 'bevy feature "wayland"'
          cargo tree -e features -p bedrock-client --target x86_64-unknown-linux-gnu --locked | grep -F 'bevy feature "x11"'
      - name: Enforce architecture boundaries
        run: cargo run -p architecture --locked -- check --root . --policy tools/architecture/policy.toml
      # The checks below are independent, so each reports even when an earlier one fails.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: cargo fmt --check
      - name: Lint Rust workspace
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint off-by-default features
        if: ${{ !cancelled() }}
        run: |
          cargo clippy -p render --features enhanced --all-targets --locked -- -D warnings
          cargo clippy -p bedrock-client --features enhanced,local-mods,developer-control,tracy --locked -- -D warnings
          cargo clippy -p bedrock-client --features reports --tests --locked -- -D warnings
      - name: Test local WASM mod and developer control adapters
        if: ${{ !cancelled() }}
        run: cargo test -p bedrock-client --features local-mods,developer-control --lib --locked -- modding developer_control
      - name: Test acceptance dry run and protocol provenance
        if: ${{ !cancelled() }}
        run: bash scripts/tests/acceptance_test.sh

  rust-tests:
    permissions:
      contents: read
      actions: write
    name: Rust tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy
      - name: Restore Rust build cache
        id: rust-cache
        uses: ./.github/actions/build-cache
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: Restore Go build cache
        id: go-cache
        uses: ./.github/actions/build-cache
        with:
          language: go
      - name: Install Linux desktop development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev
      - name: Test Rust workspace
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: Test Rust doc examples
        if: ${{ !cancelled() }}
        run: cargo test --doc --workspace --locked
      # Linux lints in `verify`.
      - name: Lint Rust workspace
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Save Rust build cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/dev' && runner.os != 'Linux' }}
        uses: ./.github/actions/build-cache
        with:
          phase: save
          key: ${{ steps.rust-cache.outputs.key }}
          bucket: ${{ steps.rust-cache.outputs.bucket }}
          paths: ${{ steps.rust-cache.outputs.paths }}

  go:
    permissions:
      contents: read
      actions: write
    name: Go (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: Restore Go build cache
        id: go-cache
        uses: ./.github/actions/build-cache
        with:
          language: go
      - name: Build release Go core
        run: go build -trimpath -o "$RUNNER_TEMP/bedrock-core$(go env GOEXE)" ./core/cmd/bedrock-core
      - name: Test and vet Go core
        run: |
          go test ./core/...
          go vet ./core/...
      - name: Test and vet protocol registry tools
        run: |
          go -C tools/registrygen test ./... -count=1
          go -C tools/registrygen vet ./...
      - name: Test and vet local server Experiences
        working-directory: tools/localserver
        env:
          GOWORK: "off"
        run: |
          go test ./... -count=1
          go vet ./...
      - name: Test and vet pinned chunk fixture generator
        if: runner.os == 'Linux'
        working-directory: tools/chunkfix
        env:
          GOWORK: "off"
        run: |
          go test ./... -count=1
          go vet ./...
      - name: Test and vet pinned bedsim movement trace generator
        if: runner.os == 'Linux'
        working-directory: tools/bedsimtrace
        env:
          GOWORK: "off"
        run: |
          go test ./... -count=1
          go vet ./...

      - name: Save Go build cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/dev' }}
        uses: ./.github/actions/build-cache
        with:
          phase: save
          language: go
          key: ${{ steps.go-cache.outputs.key }}
          bucket: ${{ steps.go-cache.outputs.bucket }}
          paths: ${{ steps.go-cache.outputs.paths }}

  # Pull requests only; full runs cover Windows and macOS through rust-tests and go.
  platform:
    name: Platform (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.full != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # These GPU witnesses exhaust the PR budget on the software WARP adapter.
          # macOS PRs and full Windows runs still cover every excluded case.
          - name: windows
            os: windows-latest
            crates: true
            client: false
            skip: >-
              test(=gpu_culling::direct::occlusion_cuts_submitted_terrain_only_while_the_view_holds_still)
              | test(=terrain_seams::near_merged_floors_far_from_origin_leave_no_seam_pixels)
              | test(=terrain_seams::sealing_grows_silhouettes_by_less_than_a_pixel)
              | test(=terrain_seams::sealing_keeps_face_interiors_in_place)
              | test(=world_seams::far_from_origin_floors_of_cubes_slabs_and_water_leave_no_seam_pixels)
          - { name: windows client, os: windows-latest, crates: false, client: true }
          - { name: macos, os: macos-latest, crates: true, client: false }
          - { name: macos client, os: macos-latest, crates: false, client: true }
    defaults:
      run:
        shell: bash
    env:
      # Crates whose tests exercise OS-specific behaviour: cfg(windows)/cfg(target_os) code, paths
      # and install layout, processes and IPC, GPU, input and windowing. Add a crate to opt it in.
      PLATFORM_TEST_PACKAGES: >-
        -p asset-compiler -p assets -p bridge -p chunk-pipeline -p developer-control
        -p dist-local -p experience-runtime -p launcher -p mod-host -p pack-compiler
        -p protocol -p render -p rich-presence -p semantic-input -p server-experience
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - name: Restore Rust build cache
        id: rust-cache
        uses: ./.github/actions/build-cache
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: Restore Go build cache
        id: go-cache
        uses: ./.github/actions/build-cache
        with:
          language: go
      - name: Check Rust workspace
        if: matrix.crates
        run: cargo check --workspace --all-targets --locked
      - name: Build release Go core
        if: matrix.crates
        run: go build -trimpath -o "$RUNNER_TEMP/bedrock-core$(go env GOEXE)" ./core/cmd/bedrock-core
      - name: Test Go local transport and credential storage
        if: matrix.crates
        run: go test ./core/internal/streamnet ./core/internal/lockfile ./core/authcache
      - name: Test platform crates
        if: matrix.crates
        env:
          SKIP: ${{ matrix.skip }}
        run: |
          filter=()
          if [ -n "$SKIP" ]; then filter=(-E "not ($SKIP)"); fi
          # shellcheck disable=SC2086 # one -p flag per word
          cargo nextest run $PLATFORM_TEST_PACKAGES "${filter[@]}" --locked --no-fail-fast
      # The client's asset-carrier integration tests skip without local carriers, so only its library runs.
      - name: Test client library
        if: ${{ !cancelled() && matrix.client }}
        run: cargo nextest run -p bedrock-client --lib --locked --no-fail-fast

  packaging:
    name: Packaging tests
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test build cache reuse and invalidation
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py'
      - name: Test manual release preparation
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: python3 -m unittest discover -s packaging/tests -p 'test_*.py'
      - name: Test DMG retry and cleanup
        run: bash packaging/tests/make-dmg.sh
      - name: Test MSI payload extraction
        shell: pwsh
        run: ./packaging/tests/extract-msi.Tests.ps1

  macos-physics-bootstrap:
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.physics == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: Restore Go build cache
        id: go-cache
        uses: ./.github/actions/build-cache
        with:
          language: go
      - name: Install and verify the manifest-owned physics carrier through Make
        run: make physics-assets

  powershell-harness:
    name: PowerShell harness
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.scripts == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: Test Windows PowerShell 5.1 acceptance harness and dry-run contract
        shell: powershell
        run: .\scripts\tests\acceptance.Tests.ps1

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - verify
      - rust-tests
      - go
      - platform
      - packaging
      - macos-physics-bootstrap
      - powershell-harness
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to pass or be skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

name: Networking upstream watch

on:
  schedule:
    - cron: "19 9 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/networking-upstreams.json
      - .github/scripts/networking_upstream_watch.py
      - .github/tests/test_networking_upstream_watch.py
      - .github/workflows/networking-upstream-watch.yml
      - core/go.mod
      - Cargo.lock

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: networking-upstream-watch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Test source observation boundaries without network
        run: python3 -m unittest discover -s .github/tests -p test_networking_upstream_watch.py
      - name: Observe public references
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/networking_upstream_watch.py
          --output "$RUNNER_TEMP/networking-upstreams.json"
          --summary "$RUNNER_TEMP/networking-upstreams.md"
      - name: Show source observations
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ -f "$RUNNER_TEMP/networking-upstreams.md" ]; then
            cat "$RUNNER_TEMP/networking-upstreams.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name != 'pull_request'
        with:
          name: networking-upstream-observations
          path: |
            ${{ runner.temp }}/networking-upstreams.json
            ${{ runner.temp }}/networking-upstreams.md
          retention-days: 7
          if-no-files-found: error

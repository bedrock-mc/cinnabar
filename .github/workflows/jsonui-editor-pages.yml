name: JSON-UI editor site

on:
  push:
    branches:
      - dev
    # Broad on purpose: the plan job decides from the dependency graph whether the site changed.
    paths:
      - crates/**
      - tools/jsonui-editor/**
      - tools/figma-plugin/**
      - assets/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - Makefile
      - .github/workflows/jsonui-editor-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jsonui-editor-pages
  cancel-in-progress: false

jobs:
  # Builds when devtool's CI plan selects the editor or the font compiler the site runs (both
  # select on their declared reads), or when the Makefile or the Figma plugin shell changes.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build: ${{ steps.affected.outputs.build }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Plan from the pushed range
        id: affected
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          build=true
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] \
            && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            names="$(cargo run -p devtool --locked -- ci-plan --base "$BEFORE" | sed -n 's/^names=//p')"
            build=false
            for name in jsonui-editor asset-compiler; do
              if [[ " $names " == *" $name "* ]]; then build=true; fi
            done
            if ! git diff --quiet "$BEFORE" HEAD -- Makefile tools/figma-plugin; then build=true; fi
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
      # Replacing this job's cache entry.
      actions: write
    env:
      # The build cache saves target/: keep intermediates there, without debug info, as ci.yml does.
      CARGO_BUILD_BUILD_DIR: "{workspace-root}/target"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      # The wasm library, its host build scripts and proc-macros, and the debug font compiler.
      - name: Restore Rust build cache
        id: rust-cache
        uses: ./.github/actions/build-cache
        with:
          lane: jsonui-editor-ci
          cargo-outputs: release wasm32-unknown-unknown/release
      - name: Install the wasm-bindgen CLI Cargo.lock pins
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          name="wasm-bindgen-${version}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${name}.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: Build the site
        run: make jsonui-editor JSONUI_EDITOR_OUT=_site
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # Reuses the wasm build above; the zip lets designers import the plugin without a toolchain.
      - name: Bundle the Figma plugin into the site
        run: |
          make figma-plugin
          stage="$RUNNER_TEMP/figma-to-jsonui"
          mkdir -p "$stage"
          cp -R tools/figma-plugin/manifest.json tools/figma-plugin/README.md tools/figma-plugin/dist "$stage/"
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/_site/figma-plugin.zip" figma-to-jsonui)
      - name: Fail on any file outside the editor's own set
        run: bash tools/jsonui-editor/check-site.sh _site
      - uses: actions/configure-pages@v6
      # Keep the Pages tar payload, including .nojekyll, with the current uploader.
      - name: Archive the Pages site
        run: |
          tar --dereference --hard-dereference --directory _site \
            -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Save Rust build cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/dev' }}
        # A cache problem, reported as an annotation, must not stop the deployment.
        continue-on-error: true
        uses: ./.github/actions/build-cache
        with:
          phase: save
          key: ${{ steps.rust-cache.outputs.key }}
          bucket: ${{ steps.rust-cache.outputs.bucket }}
          paths: ${{ steps.rust-cache.outputs.paths }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

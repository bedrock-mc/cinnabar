name: JSON-UI editor site

on:
  push:
    branches:
      - dev
    # Broad on purpose: the plan job decides from the dependency graph whether the site changed.
    paths:
      - crates/**
      - tools/jsonui-editor/**
      - assets/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - Makefile
      - .github/workflows/jsonui-editor-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jsonui-editor-pages
  cancel-in-progress: false

jobs:
  # Builds when devtool's CI plan selects the editor or the font compiler the site runs (both
  # select on their declared reads), or when the Makefile target that drives the build changes.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build: ${{ steps.affected.outputs.build }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Plan from the pushed range
        id: affected
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          build=true
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] \
            && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            names="$(cargo run -p devtool --locked -- ci-plan --base "$BEFORE" | sed -n 's/^names=//p')"
            build=false
            for name in jsonui-editor asset-compiler; do
              if [[ " $names " == *" $name "* ]]; then build=true; fi
            done
            if ! git diff --quiet "$BEFORE" HEAD -- Makefile; then build=true; fi
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: jsonui-editor-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            jsonui-editor-${{ runner.os }}-
      - name: Install the wasm-bindgen CLI Cargo.lock pins
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          name="wasm-bindgen-${version}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${name}.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: Build the site
        run: make jsonui-editor JSONUI_EDITOR_OUT=_site
      - name: Fail on any file outside the editor's own set
        run: bash tools/jsonui-editor/check-site.sh _site
      - uses: actions/configure-pages@v6
      # Keep the Pages tar payload, including .nojekyll, with the current uploader.
      - name: Archive the Pages site
        run: |
          tar --dereference --hard-dereference --directory _site \
            -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

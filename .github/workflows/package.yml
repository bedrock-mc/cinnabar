name: Package

# A daily schedule or a manual `nightly` run refreshes the default branch's nightly prerelease;
# other manual runs and v* tags publish tagged Beta releases as latest. Android requires its release
# keystore; desktop signing is optional. Without CINNABAR_UPDATE_SIGNING_KEY the channel's update manifest is left unchanged.
on:
  schedule:
    - cron: "30 3 * * *"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: Cinnabar app version (independent of the Minecraft protocol), or nightly to refresh its prerelease
        required: true
        default: current
        type: choice
        options: [current, patch, minor, major, custom, nightly]
      version:
        description: Custom app version X.Y.Z (only for custom)
        type: string
      branch:
        description: Branch to release (blank uses the selected workflow branch)
        type: string

concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.bump == 'nightly') && 'package-nightly' || 'package-release' }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: source

env:
  UPDATE_TRUSTED_KEYS: ${{ vars.UPDATE_TRUSTED_KEYS }}
  # The build cache saves target/; keep compiler intermediates there, not in the shared build-dir.
  CARGO_BUILD_BUILD_DIR: "{workspace-root}/target"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # These overrides also enable symbols when packaging an older source checkout.
  CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"
  CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "packed"
  CARGO_PROFILE_RELEASE_STRIP: "debuginfo"
  CINNABAR_SOURCE_ROOT: ${{ github.workspace }}/source

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      track: ${{ steps.release.outputs.track }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      ref: ${{ steps.release.outputs.ref }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.branch || github.ref_name) || github.sha }}
          path: source
      - name: Check out release tooling from the workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Resolve the version, tag, and build commit
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUMP: ${{ inputs.bump || 'current' }}
          CUSTOM_VERSION: ${{ inputs.version }}
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GITHUB_WORKSPACE/release-tools/packaging/prepare-release.py"

  macos:
    permissions:
      contents: read
      actions: write
    name: macOS ${{ matrix.arch }}
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, target: aarch64-apple-darwin, goarch: arm64 }
          - { arch: x86_64, target: x86_64-apple-darwin, goarch: amd64 }
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      GOOS: darwin
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "1"
      CC: clang
      CXX: clang++
      # Keep Go's native cgo behavior when compiling the Intel helpers on arm64.
      CGO_CFLAGS: -O2 -g -arch ${{ matrix.arch }}
      CGO_CXXFLAGS: -O2 -g -arch ${{ matrix.arch }}
      CGO_LDFLAGS: -O2 -g -arch ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
          path: source
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Resolve the downloadable artifact name
        run: python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-downloads.py" env macos "${{ matrix.arch }}" --version "${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add "$CARGO_BUILD_TARGET"
      - name: Restore Rust release build cache
        id: rust-cache
        uses: ./release-tools/.github/actions/build-cache
        with:
          workspace: source
          lane: release
          store: artifact
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: Restore Go build cache
        id: go-cache
        uses: ./release-tools/.github/actions/build-cache
        with:
          workspace: source
          language: go
          lane: release
          store: artifact
      - name: Install icon renderer
        run: brew install librsvg
      - name: Detect signing credentials
        id: signing
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          if [[ -n "$MACOS_CERT_P12_BASE64" && -n "$CODESIGN_IDENTITY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No macOS signing secrets; building an ad-hoc signed, unnotarized DMG"
          fi
      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$MACOS_CERT_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MACOS_CERT_PASSWORD" "$keychain"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERT_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Package, sign, notarize
        env:
          # Empty selects sign-notarize.sh's ad-hoc path.
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.enabled == 'true' && secrets.CODESIGN_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          bin="$PWD/target/$CARGO_BUILD_TARGET/release"
          make package-binaries PACKAGE_CARGO_FLAGS=--timings DIST_CORE="$bin/bedrock-core" LOCAL_SERVER_OUT="$bin/bedrock-local-server"
          # The runtime table packaging stages from, plus the prep-kit compiler.
          while read -r binary; do
            lipo "$bin/$binary" -verify_arch "${{ matrix.arch }}"
          done < <(awk '{print $1} END {print "assetc"}' packaging/common/runtime-binaries.txt)
          tools="$GITHUB_WORKSPACE/release-tools/packaging/macos"
          CLIENT="$bin/cinnabar" CORE="$bin/bedrock-core" \
            LOCAL_SERVER="$bin/bedrock-local-server" ASSETC="$bin/assetc" bash "$tools/build-app.sh"
          bash "$tools/sign-notarize.sh" .local/dist/macos-release/Cinnabar.app
          version="${{ needs.prepare.outputs.version }}"
          bash "$tools/make-dmg.sh" .local/dist/macos-release/Cinnabar.app ".local/dist/macos-release/Cinnabar-$version.dmg"
          bash "$tools/sign-notarize.sh" ".local/dist/macos-release/Cinnabar-$version.dmg"
      - name: Collect release symbols
        id: symbols
        # Each binary's .dSYM; the DMG holds only the stripped binaries.
        run: |
          python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-symbols.py" collect macos "${{ matrix.arch }}" \
            --version "${{ needs.prepare.outputs.version }}" --commit "${{ needs.prepare.outputs.commit }}" \
            --binaries "target/$CARGO_BUILD_TARGET/release" --out "$RUNNER_TEMP/$SYMBOLS_ASSET"
      - name: Name the artifact by architecture
        run: mv .local/dist/macos-release/Cinnabar-*.dmg "$RUNNER_TEMP/$RELEASE_ASSET"
      - name: Check the DMG against the payload allowlist
        run: |
          mount="$RUNNER_TEMP/dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$RUNNER_TEMP/$RELEASE_ASSET"
          status=0
          bash "$GITHUB_WORKSPACE/release-tools/packaging/check-payload.sh" macos "$mount" || status=$?
          hdiutil detach "$mount"
          exit "$status"
      - name: Save Rust release build cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/dev' }}
        # A cache problem, reported as an annotation, must not stop the release.
        continue-on-error: true
        uses: ./release-tools/.github/actions/build-cache
        with:
          phase: save
          workspace: source
          lane: release
          store: artifact
          key: ${{ steps.rust-cache.outputs.key }}
          bucket: ${{ steps.rust-cache.outputs.bucket }}
          paths: ${{ steps.rust-cache.outputs.paths }}
          prefix: ${{ steps.rust-cache.outputs.prefix }}
      - name: Save Go build cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/dev' }}
        # A cache problem, reported as an annotation, must not stop the release.
        continue-on-error: true
        uses: ./release-tools/.github/actions/build-cache
        with:
          phase: save
          workspace: source
          language: go
          lane: release
          store: artifact
          key: ${{ steps.go-cache.outputs.key }}
          bucket: ${{ steps.go-cache.outputs.bucket }}
          paths: ${{ steps.go-cache.outputs.paths }}
          prefix: ${{ steps.go-cache.outputs.prefix }}
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ env.RELEASE_ASSET }}
          if-no-files-found: error
      - if: steps.symbols.outputs.archived == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: symbols-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ env.SYMBOLS_ASSET }}
          if-no-files-found: error

      - name: Upload Rust build timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-timings-macos-${{ matrix.arch }}
          path: source/target/cargo-timings/cargo-timing.html
          if-no-files-found: warn

  windows:
    permissions:
      contents: read
      actions: write
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
          path: source
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Resolve the downloadable artifact name
        run: python "$GITHUB_WORKSPACE/release-tools/packaging/release-downloads.py" env windows x86_64 --version "${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Restore Rust release build cache
        id: rust-cache
        uses: ./release-tools/.github/actions/build-cache
        with:
          workspace: source
          lane: release
          store: artifact
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: Restore Go build cache
        id: go-cache
        uses: ./release-tools/.github/actions/build-cache
        with:
          workspace: source
          language: go
          lane: release
          store: artifact
      - name: Install WiX, ImageMagick and make
        shell: pwsh
        run: |
          # The .wxs uses <Files>, which needs WiX 5.
          dotnet tool install --global wix --version 5.0.2
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
          choco install imagemagick --no-progress -y
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) { choco install make --no-progress -y }
          $magick = Get-ChildItem "$env:ProgramFiles\ImageMagick*" -Directory | Select-Object -First 1
          if (-not $magick) { throw "ImageMagick install directory not found" }
          Add-Content $env:GITHUB_PATH $magick.FullName
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.dotnet\tools"
          Add-Content $env:GITHUB_PATH "$env:ProgramData\chocolatey\bin"
      - name: Package and sign
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          make package-binaries PACKAGE_CARGO_FLAGS=--timings
          pwsh -NoProfile -File "$GITHUB_WORKSPACE/release-tools/packaging/windows/build-installer.ps1" -Root "$CINNABAR_SOURCE_ROOT"
          mv .local/dist/windows-release/Cinnabar-*-x64.msi "$RUNNER_TEMP/$AUXILIARY_ASSET"
          mv .local/dist/windows-release/Cinnabar-*-x64-setup.exe "$RUNNER_TEMP/$RELEASE_ASSET"
      - name: Collect release symbols
        id: symbols
        # Each executable's PDB; the MSI holds only the executables.
        run: |
          python "$GITHUB_WORKSPACE/release-tools/packaging/release-symbols.py" collect windows x86_64 \
            --version "${{ needs.prepare.outputs.version }}" --commit "${{ needs.prepare.outputs.commit }}" \
            --binaries target/release --out "$RUNNER_TEMP/$SYMBOLS_ASSET"
      - name: Extract the MSI
        shell: pwsh
        run: |
          $image = Join-Path $env:RUNNER_TEMP "msi-image"
          $msi = Join-Path $env:RUNNER_TEMP $env:AUXILIARY_ASSET
          & "$env:GITHUB_WORKSPACE/release-tools/packaging/windows/extract-msi.ps1" -Msi $msi -Out $image
      - name: Check the MSI against the payload allowlist
        run: bash "$GITHUB_WORKSPACE/release-tools/packaging/check-payload.sh" windows "$(cygpath -u "$RUNNER_TEMP")/msi-image"
      - name: Check the setup embeds the verified MSI
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/release-tools/packaging/windows/check-setup.ps1" -Setup (Join-Path $env:RUNNER_TEMP $env:RELEASE_ASSET) `
            -Msi (Join-Path $env:RUNNER_TEMP $env:AUXILIARY_ASSET) -Out "$env:RUNNER_TEMP/setup-image"
      - name: Smoke test the setup engine without installing
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP $env:RELEASE_ASSET
          $layout = Join-Path $env:RUNNER_TEMP "setup-layout"
          $log = Join-Path $env:RUNNER_TEMP "setup-layout.log"
          $process = Start-Process -FilePath $setup -ArgumentList @('/layout', ('"' + $layout + '"'),
            '/quiet', '/norestart', '/log', ('"' + $log + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content $log; throw "Setup layout failed: $($process.ExitCode)" }
      - name: Save Rust release build cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/dev' }}
        # A cache problem, reported as an annotation, must not stop the release.
        continue-on-error: true
        uses: ./release-tools/.github/actions/build-cache
        with:
          phase: save
          workspace: source
          lane: release
          store: artifact
          key: ${{ steps.rust-cache.outputs.key }}
          bucket: ${{ steps.rust-cache.outputs.bucket }}
          paths: ${{ steps.rust-cache.outputs.paths }}
          prefix: ${{ steps.rust-cache.outputs.prefix }}
      - name: Save Go build cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/dev' }}
        # A cache problem, reported as an annotation, must not stop the release.
        continue-on-error: true
        uses: ./release-tools/.github/actions/build-cache
        with:
          phase: save
          workspace: source
          language: go
          lane: release
          store: artifact
          key: ${{ steps.go-cache.outputs.key }}
          bucket: ${{ steps.go-cache.outputs.bucket }}
          paths: ${{ steps.go-cache.outputs.paths }}
          prefix: ${{ steps.go-cache.outputs.prefix }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            ${{ runner.temp }}/${{ env.AUXILIARY_ASSET }}
            ${{ runner.temp }}/${{ env.RELEASE_ASSET }}
          if-no-files-found: error
      - if: steps.symbols.outputs.archived == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: symbols-windows-x64
          path: ${{ runner.temp }}/${{ env.SYMBOLS_ASSET }}
          if-no-files-found: error

      - name: Upload Rust build timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-timings-windows-x64
          path: source/target/cargo-timings/cargo-timing.html
          if-no-files-found: warn

  linux:
    permissions:
      contents: read
      actions: write
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            arch: x86_64
            appimage_arch: x86_64
            runner: ubuntu-24.04
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - name: Raspberry Pi Linux
            arch: arm64
            appimage_arch: aarch64
            # Keep the glibc baseline below Raspberry Pi OS Bookworm's 2.36.
            runner: ubuntu-22.04-arm
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    env:
      # Runs AppImages without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.appimage_arch }}.AppImage
      APPIMAGETOOL_SHA256: ${{ matrix.appimagetool_sha256 }}
      APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${{ matrix.appimage_arch }}
      APPIMAGE_RUNTIME_SHA256: ${{ matrix.runtime_sha256 }}
      # Keep debug info in the linked binaries; release-symbols.py split moves it to .debug files.
      # The profile's strip would also drop the line tables and skeleton units a packed .dwp needs.
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
      CARGO_PROFILE_RELEASE_STRIP: "none"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
          path: source
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - uses: actions/setup-python@v6
        if: matrix.arch == 'arm64'
        with:
          # Ubuntu 22.04's system Python predates tomllib and hashlib.file_digest.
          python-version: '3.13'
      - name: Resolve the downloadable artifact name
        run: python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-downloads.py" env linux "${{ matrix.arch }}" --version "${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Restore Rust release build cache
        id: rust-cache
        uses: ./release-tools/.github/actions/build-cache
        with:
          workspace: source
          lane: release
          store: artifact
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: Restore Go build cache
        id: go-cache
        uses: ./release-tools/.github/actions/build-cache
        with:
          workspace: source
          language: go
          lane: release
          store: artifact
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev librsvg2-bin
          fetch() {
            curl --fail --location --silent --show-error --output "$1" "$2"
            echo "$3  $1" | sha256sum --check --strict
          }
          fetch "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL" "$APPIMAGETOOL_SHA256"
          fetch "$RUNNER_TEMP/appimage-runtime" "$APPIMAGE_RUNTIME_URL" "$APPIMAGE_RUNTIME_SHA256"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$RUNNER_TEMP/appimage-runtime" >> "$GITHUB_ENV"
      - name: Package
        run: |
          make package-binaries PACKAGE_CARGO_FLAGS=--timings
          # The AppImage stages the stripped copies; their .debug files go only to the symbol archive.
          shipped="$RUNNER_TEMP/release-binaries"
          python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-symbols.py" split target/release "$shipped"
          BINARIES="$shipped" ASSETC="$shipped/assetc" bash "$GITHUB_WORKSPACE/release-tools/packaging/linux/build-appimage.sh"
          mv .local/dist/linux-release/Cinnabar-*-"${{ matrix.appimage_arch }}".AppImage "$RUNNER_TEMP/$RELEASE_ASSET"
      - name: Collect release symbols
        id: symbols
        run: |
          python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-symbols.py" collect linux "${{ matrix.arch }}" \
            --version "${{ needs.prepare.outputs.version }}" --commit "${{ needs.prepare.outputs.commit }}" \
            --binaries "$RUNNER_TEMP/release-binaries" --out "$RUNNER_TEMP/$SYMBOLS_ASSET"
      - name: Check the AppImage against the payload allowlist
        run: |
          cd "$RUNNER_TEMP"
          "./$RELEASE_ASSET" --appimage-extract > /dev/null
          bash "$GITHUB_WORKSPACE/release-tools/packaging/check-payload.sh" linux "$RUNNER_TEMP/squashfs-root"
      - name: Save Rust release build cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/dev' }}
        # A cache problem, reported as an annotation, must not stop the release.
        continue-on-error: true
        uses: ./release-tools/.github/actions/build-cache
        with:
          phase: save
          workspace: source
          lane: release
          store: artifact
          key: ${{ steps.rust-cache.outputs.key }}
          bucket: ${{ steps.rust-cache.outputs.bucket }}
          paths: ${{ steps.rust-cache.outputs.paths }}
          prefix: ${{ steps.rust-cache.outputs.prefix }}
      - name: Save Go build cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/dev' }}
        # A cache problem, reported as an annotation, must not stop the release.
        continue-on-error: true
        uses: ./release-tools/.github/actions/build-cache
        with:
          phase: save
          workspace: source
          language: go
          lane: release
          store: artifact
          key: ${{ steps.go-cache.outputs.key }}
          bucket: ${{ steps.go-cache.outputs.bucket }}
          paths: ${{ steps.go-cache.outputs.paths }}
          prefix: ${{ steps.go-cache.outputs.prefix }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ env.RELEASE_ASSET }}
          if-no-files-found: error
      - if: steps.symbols.outputs.archived == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: symbols-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ env.SYMBOLS_ASSET }}
          if-no-files-found: error

      - name: Upload Rust build timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-timings-linux-${{ matrix.arch }}
          path: source/target/cargo-timings/cargo-timing.html
          if-no-files-found: warn

  android:
    name: Android arm64 APK
    needs: prepare
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CINNABAR_ANDROID_PROFILE: release
      # Android APKs do not use the desktop symbol archive pipeline.
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
          path: source
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Resolve the downloadable artifact name
        run: python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-downloads.py" env android arm64 --version "${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the pinned Android SDK packages and cargo-ndk
        run: |
          pin() { python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' packaging/android/runtime.json "$1"; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-$(pin target_sdk)" "build-tools;$(pin build_tools)" "ndk;$(pin ndk)" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$(pin ndk)" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$(pin ndk)" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "$(pin cargo_ndk)" --locked
      - name: Install the Android icon renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Build and sign the release APK
        env:
          CINNABAR_ANDROID_KEYSTORE_BASE64: ${{ secrets.CINNABAR_ANDROID_KEYSTORE_BASE64 }}
          CINNABAR_ANDROID_KEY_ALIAS: ${{ secrets.CINNABAR_ANDROID_KEY_ALIAS }}
          CINNABAR_ANDROID_STORE_PASSWORD: ${{ secrets.CINNABAR_ANDROID_STORE_PASSWORD }}
          CINNABAR_ANDROID_KEY_PASSWORD: ${{ secrets.CINNABAR_ANDROID_KEY_PASSWORD }}
        run: |
          # Android updates require the same signing identity. Never publish a throwaway test key.
          : "${CINNABAR_ANDROID_KEYSTORE_BASE64:?Configure the Android release keystore secret}"
          : "${CINNABAR_ANDROID_KEY_ALIAS:?Configure the Android release key alias secret}"
          : "${CINNABAR_ANDROID_STORE_PASSWORD:?Configure the Android release store password secret}"
          : "${CINNABAR_ANDROID_KEY_PASSWORD:?Configure the Android release key password secret}"
          umask 077
          keystore="$(mktemp "$RUNNER_TEMP/android-release.XXXXXX.keystore")"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$CINNABAR_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          export CINNABAR_ANDROID_KEYSTORE="$keystore"
          bash packaging/android/build-apk.sh
          mv target/android/*-arm64-v8a.apk "$RUNNER_TEMP/$RELEASE_ASSET"
      - uses: actions/upload-artifact@v7
        with:
          name: android-arm64
          path: ${{ runner.temp }}/${{ env.RELEASE_ASSET }}
          if-no-files-found: error

  release:
    name: Publish
    needs: [prepare, macos, windows, linux, android]
    if: ${{ github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v') }}
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MACOS_SIGNED: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.CODESIGN_IDENTITY != '' }}
      WINDOWS_SIGNED: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
      UPDATE_SIGNED: ${{ secrets.CINNABAR_UPDATE_SIGNING_KEY != '' }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_TRACK: ${{ needs.prepare.outputs.track }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.ref }}
          path: source
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          path: source/dist
          # Timing reports are CI diagnostics, never release downloads; symbol archives are.
          pattern: "{macos-*,windows-x64,linux-*,android-arm64,symbols-*}"
          merge-multiple: true
      - name: Resolve release metadata names
        run: python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-downloads.py" env --channel "$RELEASE_CHANNEL" --tag "$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Add the standalone Linux installer
        run: python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-downloads.py" install-script --output "dist/$INSTALL_SCRIPT"
      - name: Install the release tooling Rust toolchain
        if: env.UPDATE_SIGNED == 'true'
        working-directory: release-tools
        run: rustup toolchain install
      - name: Sign the update manifest
        env:
          CINNABAR_UPDATE_SIGNING_KEY: ${{ secrets.CINNABAR_UPDATE_SIGNING_KEY }}
        run: |
          if [[ -z "$CINNABAR_UPDATE_SIGNING_KEY" ]]; then
            echo "::notice::CINNABAR_UPDATE_SIGNING_KEY is unset; skipping the signed $RELEASE_CHANNEL update manifest"
            exit 0
          fi
          # Update payloads live beside the manifest under content-addressed names, apart from the
          # native installer downloads, so no upload replaces a file a published manifest names.
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/$UPDATE_MANIFEST_TAG"
          args=()
          while IFS= read -r spec; do
            args+=(-artifact "$spec")
          done < <(python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-downloads.py" update-payloads \
            "$base" "$GITHUB_WORKSPACE/source/dist" "$RUNNER_TEMP/update-payloads")
          # The signer comes from the workflow revision, so older source branches still sign.
          # Packaged clients bake in this run number, which orders successive builds of one version.
          (cd "$GITHUB_WORKSPACE/release-tools" && cargo run --quiet --locked -p release-manifest -- \
            sign -version "$RELEASE_VERSION" -channel "$RELEASE_CHANNEL" -build-number "$GITHUB_RUN_NUMBER" "${args[@]}") \
            > "$RUNNER_TEMP/$UPDATE_MANIFEST.partial"
          mv "$RUNNER_TEMP/$UPDATE_MANIFEST.partial" "$RUNNER_TEMP/$UPDATE_MANIFEST"
      - name: Verify all downloads and checksum the release
        # Use the same effective debug-generation setting as the native packaging jobs.
        run: |
          symbols=()
          [[ "$(python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-symbols.py" has-symbols)" == true ]] ||
            symbols=(--without-symbols)
          python3 "$GITHUB_WORKSPACE/release-tools/packaging/release-downloads.py" checksums dist \
            --version "$RELEASE_VERSION" "${symbols[@]}"
      - name: Prepare the tagged release
        id: prepare_publish
        if: needs.prepare.outputs.track == 'tagged'
        run: |
          bash "$GITHUB_WORKSPACE/release-tools/packaging/release-notes.sh" release > "$RUNNER_TEMP/notes.md"
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            # Notes start at the last published release, not an unpublished attempt's tag.
            previous="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
            notes_start=()
            if [[ -n "$previous" ]]; then
              notes_start+=(--notes-start-tag "$previous")
            fi
            # Publish a new version only after its downloads and signed metadata are present.
            gh release create "$RELEASE_TAG" --draft --latest=false --verify-tag --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TAG" --generate-notes "${notes_start[@]}" --notes-file "$RUNNER_TEMP/notes.md"
            echo "created=true" >> "${GITHUB_OUTPUT:-/dev/null}"
          fi
          # Keep an existing release public so cached manifests can still fetch their payloads.
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            [[ -e "dist/$name" || "$name" == "$UPDATE_MANIFEST" || "$name" == "$UPDATE_PAYLOAD_PREFIX"* ]] ||
              gh release delete-asset "$RELEASE_TAG" "$name" --yes
          done
      - name: Publish the signed update manifest
        id: publish_manifest
        # New payloads, then the manifest naming them; retain the preceding publication too.
        # Without a new manifest, the current one and its payloads stay untouched.
        run: |
          manifest="$RUNNER_TEMP/$UPDATE_MANIFEST"
          payloads="$RUNNER_TEMP/update-payloads"
          if [[ ! -e "$manifest" ]]; then
            echo "::notice::No signed $RELEASE_CHANNEL update manifest; the published one stays current"
            exit 0
          fi
          if ! gh release view "$UPDATE_MANIFEST_TAG" > /dev/null 2>&1; then
            [[ "$RELEASE_TRACK" == rolling ]] || { echo "::error::Tagged release was not prepared"; exit 1; }
            # The rolling holder can never become the repository's latest release.
            gh release create "$UPDATE_MANIFEST_TAG" --prerelease --latest=false --target "$RELEASE_COMMIT" \
              --title "${RELEASE_CHANNEL^} updates" --notes "Signed update manifest for the $RELEASE_CHANNEL channel."
          fi
          previous="$RUNNER_TEMP/previous-update"
          mkdir -p "$previous"
          gh release view "$UPDATE_MANIFEST_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/published-assets"
          : > "$RUNNER_TEMP/retained-payloads"
          prune=false
          if grep -Fxq "$UPDATE_MANIFEST" "$RUNNER_TEMP/published-assets"; then
            gh release download "$UPDATE_MANIFEST_TAG" --pattern "$UPDATE_MANIFEST" --dir "$previous" --clobber
            if (cd "$GITHUB_WORKSPACE/release-tools" && cargo run --quiet --locked -p release-manifest -- \
              payload-names "$previous/$UPDATE_MANIFEST") > "$RUNNER_TEMP/retained-payloads"; then
              prune=true
            else
              echo "::notice::Cannot read the preceding manifest; retain all earlier payloads"
            fi
          fi
          # Identical payload names are immutable; clobbering would briefly remove a live download.
          : > "$RUNNER_TEMP/new-payload-names"
          for payload in "$payloads"/*; do
            name="${payload##*/}"
            printf '%s\n' "$name" >> "$RUNNER_TEMP/new-payload-names"
            if ! grep -Fxq "$name" "$RUNNER_TEMP/published-assets"; then
              gh release upload "$UPDATE_MANIFEST_TAG" "$payload"
            fi
          done
          if [[ ! -e "$previous/$UPDATE_MANIFEST" ]] || ! cmp -s "$previous/$UPDATE_MANIFEST" "$manifest"; then
            gh release upload "$UPDATE_MANIFEST_TAG" "$manifest" --clobber
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
          # A renewed signature over the same payloads must not shorten their predecessor's grace.
          LC_ALL=C sort -o "$RUNNER_TEMP/new-payload-names" "$RUNNER_TEMP/new-payload-names"
          if [[ "$prune" != true ]] || cmp -s "$RUNNER_TEMP/retained-payloads" "$RUNNER_TEMP/new-payload-names"; then
            exit 0
          fi
          gh release view "$UPDATE_MANIFEST_TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            if [[ "$name" == "$UPDATE_PAYLOAD_PREFIX"* && ! -e "$payloads/$name" ]] &&
              ! grep -Fxq "$name" "$RUNNER_TEMP/retained-payloads"; then
              gh release delete-asset "$UPDATE_MANIFEST_TAG" "$name" --yes
            fi
          done
      - name: Publish the rolling prerelease
        if: needs.prepare.outputs.track == 'rolling'
        run: |
          previous="$(git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" || true)"
          bash "$GITHUB_WORKSPACE/release-tools/packaging/release-notes.sh" "$RELEASE_CHANNEL" "$previous" > "$RUNNER_TEMP/notes.md"
          title="${RELEASE_CHANNEL^} $(date -u +%Y-%m-%d) ($(git rev-parse --short HEAD))"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            # The manifest and its payloads change only in the signed manifest step.
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              [[ -e "dist/$name" || "$name" == "$UPDATE_MANIFEST" || "$name" == "$UPDATE_PAYLOAD_PREFIX"* ]] ||
                gh release delete-asset "$RELEASE_TAG" "$name" --yes
            done
          else
            gh release create "$RELEASE_TAG" dist/* --prerelease --latest=false --target "$RELEASE_COMMIT" \
              --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          git tag -f "$RELEASE_TAG" "$RELEASE_COMMIT"
          git push -f origin "refs/tags/$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease --latest=false --draft=false
      - name: Publish the tagged release
        if: needs.prepare.outputs.track == 'tagged'
        run: |
          # Keep the generated changelog and installation notes from release creation.
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" \
            --draft=false --prerelease=false --latest=true
      - name: Announce the release to the Cinnabar API
        if: steps.publish_manifest.outputs.published == 'true'
        # Clients still verify the signed manifest; a failed notice only waits for their next check.
        continue-on-error: true
        env:
          MANIFEST_PUBLISHED: ${{ steps.publish_manifest.outputs.published }}
          CINNABAR_API_RELEASE_HOOK_SECRET: ${{ secrets.CINNABAR_API_RELEASE_HOOK_SECRET }}
        run: |
          [[ "$MANIFEST_PUBLISHED" == true ]] || exit 0
          if [[ -z "$CINNABAR_API_RELEASE_HOOK_SECRET" ]]; then
            echo "::warning::CINNABAR_API_RELEASE_HOOK_SECRET is unset; skipping the Cinnabar API release notice"
            exit 0
          fi
          base="$(jq -r '.constants[] | select(.go_name == "CinnabarAPIBaseURL") | .value' \
            "$GITHUB_WORKSPACE/release-tools/crates/bridge/data/contract.json")"
          body="$(jq -cn --arg channel "$RELEASE_CHANNEL" --arg version "$RELEASE_VERSION" --argjson build "$GITHUB_RUN_NUMBER" \
            '{channel: $channel, version: $version, build: $build}')"
          # The header comes from a builtin through a pipe, so the secret never reaches a process argument.
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$base/v1/releases" \
            -A "cinnabar-release/$RELEASE_VERSION" \
            -H @<(printf 'Authorization: Bearer %s\n' "$CINNABAR_API_RELEASE_HOOK_SECRET") \
            -H 'Content-Type: application/json' --data "$body")" || true
          if [[ "$status" != 204 ]]; then
            echo "::warning::Cinnabar API release notice failed (HTTP ${status:-none}); clients pick the release up on their next check"
          fi
      - name: Post the changelog to Discord
        if: steps.prepare_publish.outputs.created == 'true'
        continue-on-error: true
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
        run: python3 "$GITHUB_WORKSPACE/release-tools/packaging/changelog.py" discord "$RELEASE_TAG"

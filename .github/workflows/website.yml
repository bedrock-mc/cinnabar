name: Website

on:
  push:
    branches: [dev]
    paths:
      - 'website/**'
      - 'assets/branding/title.png'
      - 'packaging/icons/cinnabar.svg'
      - 'packaging/release-assets.json'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'assets/branding/title.png'
      - 'packaging/icons/cinnabar.svg'
      - 'packaging/release-assets.json'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_VERSION: '4.151.0'

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test website and deployment boundary
        run: |
          python3 website/render.py
          node --test website/tests/app.test.cjs
          python3 -m unittest discover -s website/tests -p 'test_*.py' -v
      - name: Validate the Cloudflare configuration
        working-directory: website
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: website/dist/

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: website
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        with:
          name: website
          path: website/dist
      - name: Publish to Cloudflare
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy
      - name: Check every published file
        working-directory: website
        run: |
          set -euo pipefail
          # Share the destination with the old domain's permanent redirect.
          site_url="$(awk '$1 == "redir" { sub(/\{uri\}$/, "", $2); print $2 }' deploy/Caddyfile)"
          test -n "$site_url"
          while IFS= read -r -d '' file; do
            curl --fail --location --retry 3 "$site_url/${file#dist/}?release=$GITHUB_SHA" \
              -o "$RUNNER_TEMP/served"
            cmp "$file" "$RUNNER_TEMP/served"
          done < <(find dist -type f -print0)

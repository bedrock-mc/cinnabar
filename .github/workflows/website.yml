name: Website

on:
  push:
    branches: [dev]
    paths:
      - 'website/**'
      - 'assets/branding/title.png'
      - 'packaging/icons/cinnabar.svg'
      - 'packaging/release-assets.json'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'assets/branding/title.png'
      - 'packaging/icons/cinnabar.svg'
      - 'packaging/release-assets.json'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: Test website and deployment boundary
        run: |
          python3 website/render.py
          node --test website/tests/app.test.cjs
          python3 -m unittest discover -s website/tests -p 'test_*.py' -v
          go test -race website/server/main.go website/server/main_test.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o website/dist/server website/server/main.go
      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: website/dist/

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: website
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: website
          path: dist
      - name: Publish to the website account
        env:
          SSH_KEY: ${{ secrets.WEBSITE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WEBSITE_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.WEBSITE_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/website"
          chmod 600 "$HOME/.ssh/website"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/website"' EXIT
          (cd dist && tar -czf "$RUNNER_TEMP/website.tar.gz" -- *)
          timeout 120 ssh -i "$HOME/.ssh/website" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 \
            "cinnabar@$DEPLOY_HOST" "deploy $GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            < "$RUNNER_TEMP/website.tar.gz"
          release="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ready=false
          for attempt in $(seq 1 30); do
            observed="$(curl -fsS "https://cinnabar.restartfu.com/healthz?release=$release" || true)"
            if [ "$observed" = "$release" ]; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          for file in dist/*; do
            [ "$(basename "$file")" = server ] && continue
            curl --fail --retry 3 "https://cinnabar.restartfu.com/$(basename "$file")?release=$GITHUB_SHA" \
              -o "$RUNNER_TEMP/served"
            cmp "$file" "$RUNNER_TEMP/served"
          done

name: Build cache
description: Restore or save compiler outputs without creating caches on pull requests
# The budget manifest selects shared caches or workflow artifacts. Shared entries leave room for
# all concurrent replacements; larger CI archives and release lanes use workflow artifacts.
inputs:
  phase:
    description: restore or save
    default: restore
  language:
    description: rust or go
    default: rust
  workspace:
    description: Source checkout directory
    default: .
  lane:
    description: ci or release (Rust profiles are kept separate)
    default: ci
  cargo-outputs:
    description: Further directories under target/ to cache, such as another profile or a cross target's profile
    default: ''
  store:
    description: auto (the budgeted store), cache (GitHub cache), or artifact (workflow artifacts)
    default: auto
  prefix:
    description: Prefix returned by the restore step, which names an artifact store entry
    default: ''
  key:
    description: Key returned by the restore step
    default: ''
  bucket:
    description: Retention bucket returned by the restore step
    default: ''
  paths:
    description: Paths returned by the restore step
    default: ''
outputs:
  key:
    description: Key for this source revision and compiler configuration
    value: ${{ steps.plan.outputs.key }}
  bucket:
    description: Platform and profile retention bucket
    value: ${{ steps.plan.outputs.bucket }}
  paths:
    description: Compiler output paths
    value: ${{ steps.plan.outputs.paths }}
  prefix:
    description: Key prefix shared by compatible entries
    value: ${{ steps.plan.outputs.prefix }}
runs:
  using: composite
  steps:
    - name: Plan cache
      if: inputs.phase == 'restore'
      id: plan
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CACHE_WORKSPACE: ${{ inputs.workspace }}
        CACHE_LANGUAGE: ${{ inputs.language }}
        CACHE_LANE: ${{ inputs.lane }}
        CACHE_CARGO_OUTPUTS: ${{ inputs.cargo-outputs }}
      run: python3 "$GITHUB_ACTION_PATH/cache.py" plan
    - name: Select the budgeted cache store
      id: storage
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CACHE_BUCKET: ${{ inputs.bucket || steps.plan.outputs.bucket }}
        CACHE_KEY: ${{ inputs.key || steps.plan.outputs.key }}
        CACHE_PREFIX: ${{ inputs.prefix || steps.plan.outputs.prefix }}
        CACHE_STORE: ${{ inputs.store }}
      run: python3 "$GITHUB_ACTION_PATH/cache.py" storage
    - uses: actions/cache/restore@v5
      if: inputs.phase == 'restore' && steps.storage.outputs.store == 'cache'
      with:
        key: ${{ steps.plan.outputs.key }}
        restore-keys: ${{ steps.plan.outputs.prefix }}
        path: ${{ steps.plan.outputs.paths }}
    - name: Restore the newest artifact cache
      if: inputs.phase == 'restore' && steps.storage.outputs.store == 'artifact'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_BRANCH: ${{ github.event.repository.default_branch }}
        CACHE_PREFIX: ${{ steps.storage.outputs.prefix }}
        CACHE_BUCKET: ${{ steps.plan.outputs.bucket }}
        CACHE_PATHS: ${{ steps.plan.outputs.paths }}
      run: python3 "$GITHUB_ACTION_PATH/cache.py" restore-artifact
    - name: Restore unchanged source timestamps
      if: inputs.phase == 'restore' && inputs.language == 'rust'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CACHE_WORKSPACE: ${{ inputs.workspace }}
      run: python3 "$GITHUB_ACTION_PATH/cache.py" restore-inputs
    - name: Check cached source inputs
      if: inputs.phase == 'save' && inputs.language == 'rust'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CACHE_WORKSPACE: ${{ inputs.workspace }}
      run: python3 "$GITHUB_ACTION_PATH/cache.py" verify-inputs
    # Artifact archives leave the same outputs out as they pack.
    - name: Leave linked executables out of the cache
      if: inputs.phase == 'save' && steps.storage.outputs.store == 'cache' && inputs.language == 'rust'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CACHE_PATHS: ${{ inputs.paths }}
      run: python3 "$GITHUB_ACTION_PATH/cache.py" drop-linked-outputs
    - name: Check replacement headroom while keeping existing entries
      id: room
      if: inputs.phase == 'save' && steps.storage.outputs.store == 'cache'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_BUCKET: ${{ inputs.bucket }}
      run: python3 "$GITHUB_ACTION_PATH/cache.py" make-room
    - uses: actions/cache/save@v5
      if: inputs.phase == 'save' && steps.storage.outputs.store == 'cache' && steps.room.outputs.save == 'true'
      with:
        key: ${{ inputs.key }}
        path: ${{ inputs.paths }}
    - name: Retain the newest cache in this bucket within its budget
      if: inputs.phase == 'save' && steps.storage.outputs.store == 'cache' && steps.room.outputs.save == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_KEY: ${{ inputs.key }}
        CACHE_BUCKET: ${{ inputs.bucket }}
      run: python3 "$GITHUB_ACTION_PATH/cache.py" prune
    - name: Archive the artifact cache within its budget
      id: archive
      if: inputs.phase == 'save' && steps.storage.outputs.store == 'artifact'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CACHE_BUCKET: ${{ inputs.bucket }}
        CACHE_PREFIX: ${{ steps.storage.outputs.prefix }}
        CACHE_PATHS: ${{ inputs.paths }}
      run: python3 "$GITHUB_ACTION_PATH/cache.py" pack-artifact
    - uses: actions/upload-artifact@v7
      id: upload
      if: inputs.phase == 'save' && steps.storage.outputs.store == 'artifact'
      with:
        name: ${{ steps.archive.outputs.name }}
        path: ${{ steps.archive.outputs.archive }}
        compression-level: 0
        retention-days: ${{ inputs.lane == 'ci' && 7 || 3 }}
        # Each attempt has its own name, so a failed rerun cannot remove its predecessor.
        overwrite: false
        if-no-files-found: error
    - name: Retain the newest artifact cache
      if: inputs.phase == 'save' && steps.storage.outputs.store == 'artifact'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_BRANCH: ${{ github.event.repository.default_branch }}
        CACHE_PREFIX: ${{ steps.storage.outputs.prefix }}
        CACHE_BUCKET: ${{ inputs.bucket }}
        CACHE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        CACHE_ARCHIVE: ${{ steps.archive.outputs.archive }}
      run: python3 "$GITHUB_ACTION_PATH/cache.py" prune-artifacts

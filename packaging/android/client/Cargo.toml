[package]
name = "cinnabar-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
reads = ["packaging/android/runtime.json"]

# Android's NativeActivity and the setup activity load this library; elsewhere it is empty.
[lib]
crate-type = ["cdylib"]
doctest = false

[target.'cfg(target_os = "android")'.dependencies]
anyhow.workspace = true
assets = { path = "../../../crates/assets" }
bevy = { workspace = true, features = ["android-native-activity"] }
cinnabar = { path = "../../../app", default-features = false, features = ["native-networking"] }
first-run = { path = "../../../crates/first-run" }
jni = "=0.22.4"
rustls-platform-verifier = "=0.7.1"
launcher = { path = "../../../crates/launcher" }
launcher-host = { path = "../../../crates/launcher-host" }
# Oboe, below cpal, links the C++ runtime the APK ships instead of a private copy.
rodio = { version = "=0.20.1", default-features = false, features = ["cpal-shared-stdcxx"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[features]
shaderpacks = ["cinnabar/shaderpacks"]

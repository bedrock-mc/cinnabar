[package]
name = "cinnabar-cxb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
reads = [
    "crates/experience-sdk",
    "examples/experiences/terminal-client",
    "crates/server-experience/schema",
    "tools/localserver",
]

[dependencies]
tempfile = "=3.27.0"
experience-sdk = { path = "../../crates/experience-sdk", default-features = false, features = ["project"] }
ring = "=0.17.14"
anyhow.workspace = true
protocol = { path = "../../crates/protocol" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
server-experience = { path = "../../crates/server-experience" }
toml = "0.9"
url = "=2.5.8"
wit-component.workspace = true
zip = { version = "=7.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
mod-host = { path = "../../crates/mod-host" }
tempfile = "=3.27.0"

[lints]
workspace = true

[package]
name = "devtool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["macos", "windows"]
reads = [
    "Cargo.lock",
    "web/site/**",
    "packaging/android/AndroidManifest.xml",
    "packaging/android/render-template.sh",
    "packaging/android/runtime.json",
    "packaging/release-assets.json",
    "tools/cargo-free",
    "tools/compiler_workspace_wrapper.py",
]

[dependencies]
render-api = { path = "../../crates/render-api" }
diagnostics = { path = "../../crates/diagnostics" }
crash-report = { path = "../../crates/crash-report" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
csv = "1"
ctrlc = { version = "3.4", features = ["termination"] }
quick-xml = "0.39"
# Offline symbolication of crash minidumps against a release symbol archive.
minidump = "0.27"
minidump-processor = { version = "0.27", default-features = false, features = ["debuginfo"] }
minidump-unwind = { version = "0.27", features = ["debuginfo"] }
wholesym = "0.8"
tokio.workspace = true
regex = "1"
tempfile = "3"
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
thiserror.workspace = true
workspace-declarations = { path = "../workspace-declarations" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
test-time = { path = "../../crates/test-time" }
tempfile = "3"
minidump-synth = "0.27"
test-assembler = "0.1"
wait-timeout = "0.2"

[lints]
workspace = true

[package]
name = "ui-snapshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
test-support = ["dep:client-ui", "client-ui/test-support", "protocol/test-support", "render-model/test-support", "ui-screens/test-support"]

[dependencies]
client-ui = { path = "../../crates/client-ui", optional = true }
cosmetics = { path = "../../crates/cosmetics" }
assets = { path = "../../crates/assets" }
image.workspace = true
inventory = { path = "../../crates/inventory" }
json-ui = { path = "../../crates/json-ui" }
jsonui-editor = { path = "../jsonui-editor" }
bridge = { path = "../../crates/bridge" }
launcher = { path = "../../crates/launcher" }
mod-ui = { path = "../../crates/mod-ui" }
oreui = { path = "../../crates/oreui" }
player-state = { path = "../../crates/player-state" }
protocol = { path = "../../crates/protocol" }
render-api = { path = "../../crates/render-api" }
render-model = { path = "../../crates/render-model" }
resource-pack = { path = "../../crates/resource-pack" }
serde_json = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
ui = { path = "../../crates/ui" }
ui-engine = { path = "../../crates/ui-engine" }
ui-screens = { path = "../../crates/ui-screens" }

[dev-dependencies]
oreui = { path = "../../crates/oreui", features = ["test-support"] }
tempfile = "3"
ui-engine = { path = "../../crates/ui-engine", features = ["test-support"] }

[lints]
workspace = true

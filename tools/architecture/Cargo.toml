[package]
name = "architecture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
reads = [
    "crates/diagnostics/src/console.rs",
    "crates/diagnostics/src/console/raw_stderr.rs",
    "docs/evidence",
    "plan.md",
]

[dependencies]
cfg-expr = "=0.20.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror.workspace = true
toml = "0.9"
workspace-declarations = { path = "../workspace-declarations" }

proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

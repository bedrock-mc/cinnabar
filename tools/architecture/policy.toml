# Gameplay receives facts and inventory directly; UI may only borrow authority.
[[module_boundaries]]
path = "app/src/movement"
forbidden_modules = ["ui_runtime", "client_ui", "ui", "UiRuntime"]

[[module_boundaries]]
path = "app/src/ui_runtime"
forbidden_owned_types = ["InventorySession", "PlayerInventoryLedger", "LocalPlayerFacts", "AbilitiesUpdate", "PlayerState", "PlayerRuntime"]

[[module_boundaries]]
path = "crates/client-ui/src"
forbidden_modules = ["cinnabar"]
forbidden_crate_modules = ["app", "runtime", "movement", "mining", "item_use", "camera", "server_camera", "local_player", "semantic_controls", "settings_runtime", "acceptance", "audio", "block_selection", "block_use", "hotbar", "pick_block", "melee", "survival_mining"]
forbidden_owned_types = ["InventorySession", "PlayerInventoryLedger", "LocalPlayerFacts", "AbilitiesUpdate", "PlayerState", "PlayerRuntime"]

[[module_boundaries]]
path = "crates/launcher/src"
forbidden_modules = ["cinnabar", "client_ui", "UiRuntime", "PlayerRuntime", "PlayerState", "NetworkHandle"]
forbidden_crate_modules = ["ui_runtime", "presentation", "runtime", "movement", "acceptance"]

# Fixtures can be shared by tests without becoming callable from production adapters.
[[module_boundaries]]
path = "app/src"
forbidden_modules = ["test_support"]

# Authoritative world state cannot regain mesh scheduling or publication ownership.
[[module_boundaries]]
path = "crates/client-world/src"
forbidden_modules = ["chunk_pipeline", "meshing"]
forbidden_owned_types = ["ChunkMesh", "PublicationPermit", "PublicationAllowance", "MeshMemoryPermit"]

# Animation reads actors through its AnimatedActor seam and never owns actor authority.
[[module_boundaries]]
path = "crates/actor-animation/src"
forbidden_crate_modules = ["actor_store", "authority", "ingestion"]
forbidden_owned_types = ["ActorSnapshot", "ActorStore", "WorldAuthority"]

# The coordinator composes the authority owner, never a second mutable world store.
[[module_boundaries]]
path = "crates/chunk-pipeline/src"
forbidden_owned_types = ["ChunkStore", "ActorStore"]

# Plugin code consumes explicit observations, never host modules or session/gameplay owners.
[[module_boundaries]]
path = "crates/client-presentation/src"
forbidden_modules = ["cinnabar", "gameplay", "client_session", "NetworkHandle", "MovementTicker", "LocalPhysicsController", "ItemUseRuntime", "MiningRuntime"]
forbidden_crate_modules = ["app", "runtime", "movement", "item_use", "mining", "melee", "menu", "acceptance", "asset_startup", "player_runtime", "semantic_controls", "settings_runtime", "screen_policy"]
forbidden_owned_types = ["WorldStream", "PlayerState", "PlayerInventoryLedger", "InventorySession", "LocalPlayerFacts"]

[[module_boundaries]]
path = "crates/client-audio/src"
forbidden_modules = ["cinnabar", "client_presentation", "render", "gameplay", "client_session", "NetworkHandle", "MovementTicker", "LocalPhysicsController"]
forbidden_crate_modules = ["app", "runtime", "movement", "item_use", "mining", "melee", "menu", "acceptance", "asset_startup", "player_runtime", "semantic_controls", "settings_runtime"]
forbidden_owned_types = ["WorldStream", "PlayerState", "PlayerInventoryLedger", "InventorySession", "LocalPlayerFacts"]

[[module_boundaries]]
path = "crates/acceptance/src"
forbidden_modules = ["cinnabar", "gameplay", "client_session", "NetworkHandle", "MovementTicker", "LocalPhysicsController", "ClientWorld"]
forbidden_crate_modules = ["app", "runtime", "movement", "item_use", "mining", "menu", "asset_startup", "player_runtime"]

forbidden_crate_modules = ["app", "runtime", "movement", "asset_startup"]

# Lower domains cannot reach app adapters through rooted or renamed module paths.
[[module_boundaries]]
path = "crates/gameplay/src"
forbidden_modules = ["cinnabar", "bevy", "render", "client_ui", "client_session", "chunk_pipeline", "UiRuntime", "NetworkHandle"]
forbidden_crate_modules = ["app", "runtime", "camera", "server_camera", "local_player", "semantic_controls", "settings_runtime", "acceptance", "audio", "session_audio", "presentation", "ui_runtime", "menu"]
forbidden_owned_types = ["InventorySession", "PlayerInventoryLedger", "LocalPlayerFacts", "PlayerState", "ChunkStore", "ActorStore", "WorldAuthority"]

# This is sim::PlayerState (predicted position/velocity), not inventory/player authority.
[[module_boundaries.ownership_exceptions]]

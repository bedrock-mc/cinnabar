[[crates]]
name = "client-ui"
path = "crates/client-ui"
# Extension edges support presentation adapters; render data comes from render-model, never render.
allowed_dependencies = ["assets", "chunk-pipeline", "client-world", "player-state", "launcher", "inventory", "json-ui", "protocol", "render-api", "render-model", "resource-pack", "semantic-input", "ui", "world", "mod-host", "server-experience"]
forbidden_dependencies = ["asset-compiler", "pack-compiler"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "client-runtime", "gameplay", "client-session", "render"]
test_support_features = ["test-support"]

# Presentation borrows authoritative facts; transport/gameplay and evidence stay outside it.
[[crates]]
name = "client-presentation"
path = "crates/client-presentation"
allowed_dependencies = ["assets", "chunk-pipeline", "client-ui", "client-world", "inventory", "launcher", "player-state", "protocol", "render", "render-api", "render-model", "resource-pack", "semantic-input", "sim", "ui", "world", "meshing", "server-experience"]
forbidden_dependencies = ["asset-compiler", "pack-compiler"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "client-runtime", "gameplay", "client-session", "acceptance", "asset-compiler"]
test_support_features = ["test-support"]

[[crates]]
name = "diagnostics"
path = "crates/diagnostics"
allowed_dependencies = ["assets", "chunk-pipeline", "meshing", "protocol", "render-model", "world"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "client-runtime", "gameplay", "client-session", "acceptance", "client-presentation", "asset-compiler", "pack-compiler", "render"]

[[crates]]
name = "acceptance"
path = "crates/acceptance"
test_support_features = ["test-support"]
allowed_dependencies = ["chunk-pipeline", "client-presentation", "client-world", "diagnostics", "protocol", "render", "render-model", "semantic-input", "world"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "client-runtime", "gameplay", "client-session", "asset-compiler", "pack-compiler"]

[[crates]]
name = "semantic-input"
path = "crates/input"
allowed_dependencies = []
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]

# Control wire, auth and recording primitives shared by the client glue and controllers.
[[crates]]
name = "developer-control"
path = "crates/developer-control"
allowed_dependencies = []
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]

[[crates]]
name = "render-api"
path = "crates/render-api"
allowed_dependencies = []
# Shared contracts stay std-only, including build, dev and target dependencies.
dependency_free = true

# Render data contracts and CPU geometry; presentation builds against it without the GPU renderer.
[[crates]]
name = "render-model"
path = "crates/render-model"
allowed_dependencies = ["assets", "render-api", "world"]
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "render", "protocol", "client-world", "chunk-pipeline", "bevy", "bevy_*", "wgpu*"]

# CPU particle simulation; render only uploads and draws its output.
[[crates]]
name = "particles"
path = "crates/particles"
allowed_dependencies = ["assets"]
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "render", "protocol", "client-world", "chunk-pipeline", "bevy", "bevy_*", "wgpu*"]

[[crates]]
name = "render"
path = "crates/render"

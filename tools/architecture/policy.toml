# Tests wait with `test_time::eventually` (Rust) or `testwait`/`testing/synctest` (Go), never sleep.
# Each exception names why the file still sleeps; converting it removes the entry.
# Domain crates take `now` from their caller; only edge code reads the clock.
[timing]
clock_free_crates = [
    "crates/block-transform",
    "crates/crash-report",
    "crates/input",
    "crates/inventory",
    "crates/json-ui",
    "crates/pack-json",
    "crates/meshing",
    "crates/player-state",
    "crates/render-api",
    "crates/resource-pack",
    "crates/sim",
    "crates/simulation-clock",
    "crates/ui",
    "crates/ui-engine",
    "crates/ui-screens",
    "crates/world",
]
sleep_exceptions = [
    { path = "crates/client-ui/src/ui_runtime/presentation/forms/test_support.rs", reason = "warm snapshot frames give background menu artwork time to load; no ready signal" },
    { path = "crates/client-ui/src/ui_runtime/presentation/forms/menu_latency.rs", reason = "paces idle frames before measuring menu navigation latency" },
    { path = "crates/client-session/src/session/network_latency_bench.rs", reason = "paces movement packets at the simulation tick rate for a latency benchmark" },
    { path = "crates/server-experience/src/cache.rs", reason = "delays lease release and cancellation to exercise a pending cache replacement" },
    { path = "crates/launcher-host/src/lifecycle/children.rs", reason = "lets the detached reaper begin stopping a child without an observable ready signal" },
    { path = "crates/launcher-host/src/auth.rs", reason = "a deliberately delayed reader verifies cancellation does not wait for its thread" },
    { path = "crates/launcher-host/src/launcher_account/artwork.rs", reason = "a slow image fixture verifies feeds publish before artwork downloads" },
    { path = "crates/client-audio/src/audio/inventory.rs", reason = "keeps the opt-in audio device alive for an audible playback window" },
    { path = "app/src/tests/input_publication.rs", reason = "models expensive frame work while measuring system ordering" },
    { path = "crates/chunk-pipeline/src/stream/tests/light_scheduler.rs", reason = "a worker frees its light-job slot after settling has started" },
    { path = "crates/chunk-pipeline/src/stream/tests/light_scheduler/backlog.rs", reason = "paces frames in a backlog drain-timing test" },
    { path = "crates/chunk-pipeline/src/stream/tests/neighbour_deadlines.rs", reason = "manual timing run past the real unsent-column grace" },
    { path = "crates/chunk-pipeline/src/stream/tests/streaming_harness.rs", reason = "paces frames for the streaming harness" },
    { path = "crates/launcher-host/src/remote_images/disk/tests.rs", reason = "a fixture image server that answers slowly or stalls" },
    { path = "crates/client-session/src/session/tests.rs", reason = "a worker still busy when the network handle drops" },
    { path = "tools/cinnabar-mcp/src/tests.rs", reason = "a reply slower than the client's timeout, then the late reply arriving" },
    { path = "core/authcache/concurrency_test.go", reason = "a fake token source that is slow to refresh" },
    { path = "core/authcache/derived_test.go", reason = "a fake service that is slow to answer" },
    { path = "core/authcache/flight_test.go", reason = "racy: sleeps to let goroutines block; needs a ready signal" },
    { path = "core/cmd/bedrock-core/lifecycle_unix_test.go", reason = "a helper process that stays alive until the test kills it" },
    { path = "core/internal/lifeline/lifeline_unix_test.go", reason = "a helper process that stays alive until the test kills it" },
    { path = "core/internal/lockfile/lockfile_test.go", reason = "a lock holder that stays alive until the test kills it" },
    { path = "core/internal/streamnet/conn_test.go", reason = "racy: sleeps to let a write block; needs a ready signal" },
    { path = "core/proxy/first_join_token_live_test.go", reason = "a live, opt-in join profile that keeps credentials warm" },
    { path = "core/proxy/packet_delay_position_test.go", reason = "virtual time inside synctest bubbles" },
    { path = "core/proxy/packet_delay_test.go", reason = "virtual time inside synctest bubbles" },
    { path = "core/proxy/prepared_transport_test.go", reason = "stands in for credential acquisition time" },
    { path = "core/proxy/proxy_test.go", reason = "asserts nothing else arrives within a window" },
    { path = "core/proxy/relay_backpressure_test.go", reason = "a stalled sink; racy wait for the pump to block needs a ready signal" },
    { path = "core/proxy/resource_pack_admission_test.go", reason = "a server that trickles a slow download" },
    { path = "tools/localserver/experience/client_test.go", reason = "separate Go module without core's testwait; convert with its own helper" },
    { path = "tools/localserver/experience/dispatch_test.go", reason = "separate Go module without core's testwait; convert with its own helper" },
    { path = "tools/localserver/experience/helpers_test.go", reason = "separate Go module without core's testwait; convert with its own helper" },
]


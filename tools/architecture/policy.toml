production_rust_max = 1000
module_root_max = 300
powershell_max = 800
test_max = 1200
forbidden_artifacts = [
    "*.exe",
    "*.dll",
    "*.dylib",
    "*.so",
    "*.png",
    "*.jpg",
    "*.jpeg",
    "*.bmp",
    "*.mcpack",
    "*.mcworld",
]

# Original art, never Mojang content.
[[owned_artifacts]]
path = "assets/panorama/"
ownership_record = "THIRD_PARTY_NOTICES.md"

[[owned_artifacts]]
path = "assets/branding/"
ownership_record = "THIRD_PARTY_NOTICES.md"

# Existing oversized files may only shrink. New files and files below their
# category limit remain governed by the strict limits above.
[[line_baselines]]
path = "app/src/tests/finish.rs"
max = 1232

[[vendored]]
path = "crates/protocol/vendor/"
ownership_record = "crates/protocol/vendor/UPSTREAM.md"

[[crates]]
name = "bridge"
path = "crates/bridge"
allowed_dependencies = []
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]

[[crates]]
name = "protocol"
path = "crates/protocol"
allowed_dependencies = ["block-transform", "bridge", "render-api"]
forbidden_dependencies = ["asset-compiler", "assets", "bevy", "wgpu"]

[[crates]]
name = "resource-pack"
path = "crates/resource-pack"
allowed_dependencies = ["protocol"]
forbidden_dependencies = ["asset-compiler", "assets", "bevy", "wgpu"]

[[crates]]
name = "world"
path = "crates/world"
allowed_dependencies = []
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]

[[crates]]
name = "assets"
path = "crates/assets"
allowed_dependencies = ["block-transform"]
forbidden_dependencies = ["asset-compiler", "bevy", "clap", "image", "wgpu"]

[[crates]]
name = "asset-compiler"
path = "crates/asset-compiler"
allowed_dependencies = ["pack-compiler", "assets"]
forbidden_dependencies = ["bevy", "wgpu"]

[[crates]]
name = "json-ui"
path = "crates/json-ui"
allowed_dependencies = []
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]

[[crates]]
name = "meshing"
path = "crates/meshing"
allowed_dependencies = ["assets", "block-transform", "world"]
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]

[[crates]]
name = "client-world"
path = "crates/client-world"
allowed_dependencies = ["assets", "protocol", "render-model", "world"]
forbidden_dependencies = ["asset-compiler", "pack-compiler", "chunk-pipeline", "meshing", "render-api", "bevy", "wgpu"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "asset-compiler", "pack-compiler", "chunk-pipeline", "meshing", "ui", "json-ui", "render", "bevy", "bevy_*", "wgpu*"]

[[crates]]
name = "pack-compiler"
path = "crates/pack-compiler"
allowed_dependencies = ["assets"]
forbidden_dependencies = ["asset-compiler", "clap", "bevy", "wgpu"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "asset-compiler", "clap", "protocol", "client-world", "chunk-pipeline", "render", "bevy", "bevy_*", "wgpu*"]

[[crates]]
name = "chunk-pipeline"
path = "crates/chunk-pipeline"
test_support_features = ["publication-test-support", "benchmark-support"]
allowed_dependencies = ["client-world", "meshing", "assets", "world", "render-api"]
# Protocol is permitted only in fixtures; production consumes client-world's admitted contracts.
forbidden_dependencies = ["asset-compiler", "pack-compiler", "protocol", "bevy", "wgpu"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "asset-compiler", "pack-compiler", "ui", "json-ui", "render", "bevy", "bevy_*", "wgpu*"]

[[crates]]
name = "inventory"
path = "crates/inventory"
allowed_dependencies = ["protocol"]
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "ui", "json-ui", "render", "bevy", "bevy_*", "wgpu*", "client-world", "world"]

[[crates]]
name = "player-state"
path = "crates/player-state"
allowed_dependencies = ["client-world", "inventory"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "launcher", "client-ui", "ui", "json-ui", "render", "bevy", "bevy_*", "wgpu*"]

# Tick decisions and transport remain separate domains; app adapters compose them.
[[crates]]
name = "gameplay"
path = "crates/gameplay"
allowed_dependencies = ["assets", "block-transform", "client-world", "inventory", "player-state", "protocol", "semantic-input", "sim", "world"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "client-session", "client-runtime", "client-presentation", "acceptance", "launcher", "client-ui", "chunk-pipeline", "ui", "json-ui", "render", "asset-compiler", "pack-compiler", "bevy", "bevy_*", "wgpu*"]
test_support_features = ["test-support"]

[[crates]]
name = "client-session"
path = "crates/client-session"
allowed_dependencies = ["assets", "block-transform", "pack-compiler", "protocol", "resource-pack", "server-experience", "world"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "gameplay", "client-runtime", "client-presentation", "acceptance", "launcher", "client-ui", "client-world", "chunk-pipeline", "inventory", "player-state", "semantic-input", "ui", "json-ui", "render", "asset-compiler", "bevy", "bevy_*", "wgpu*"]
test_support_features = ["test-support"]

[[crates]]

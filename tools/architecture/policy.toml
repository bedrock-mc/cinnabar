production_rust_max = 1000
module_root_max = 300
powershell_max = 800
test_max = 1200
forbidden_artifacts = [
    "*.exe",
    "*.dll",
    "*.dylib",
    "*.so",
    "*.png",
    "*.jpg",
    "*.jpeg",
    "*.bmp",
    "*.mcpack",
    "*.mcworld",
]

# Original art, never Mojang content.
[[owned_artifacts]]
path = "assets/panorama/"
ownership_record = "THIRD_PARTY_NOTICES.md"

[[owned_artifacts]]
path = "assets/branding/"
ownership_record = "THIRD_PARTY_NOTICES.md"

[[owned_artifacts]]
path = "assets/fonts/"
ownership_record = "THIRD_PARTY_NOTICES.md"

[[vendored]]
path = "crates/protocol/vendor/"
ownership_record = "crates/protocol/vendor/UPSTREAM.md"

[[crates]]
name = "bridge"
path = "crates/bridge"
allowed_dependencies = ["test-time"]
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]

[[crates]]
name = "protocol"
path = "crates/protocol"
allowed_dependencies = ["block-transform", "bridge", "render-api", "test-time"]
forbidden_dependencies = ["asset-compiler", "assets", "bevy", "wgpu"]

[[crates]]
name = "resource-pack"
path = "crates/resource-pack"
allowed_dependencies = ["protocol"]
forbidden_dependencies = ["asset-compiler", "assets", "bevy", "wgpu"]

[[crates]]
name = "world"
path = "crates/world"
allowed_dependencies = []
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]

[[crates]]
name = "assets"
path = "crates/assets"
allowed_dependencies = ["block-transform"]
forbidden_dependencies = ["asset-compiler", "bevy", "clap", "image", "wgpu"]

[[crates]]
name = "asset-compiler"
path = "crates/asset-compiler"
allowed_dependencies = ["pack-compiler", "assets"]
forbidden_dependencies = ["bevy", "wgpu"]

[[crates]]
name = "json-ui"
path = "crates/json-ui"
allowed_dependencies = []
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]

[[crates]]
name = "meshing"
path = "crates/meshing"
allowed_dependencies = ["assets", "block-transform", "world"]
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]

[[crates]]
name = "client-world"
path = "crates/client-world"
allowed_dependencies = ["assets", "protocol", "render-model", "world"]
forbidden_dependencies = ["asset-compiler", "pack-compiler", "chunk-pipeline", "meshing", "render-api", "bevy", "wgpu"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "asset-compiler", "pack-compiler", "chunk-pipeline", "meshing", "ui", "json-ui", "render", "bevy", "bevy_*", "wgpu*"]

[[crates]]
name = "pack-compiler"
path = "crates/pack-compiler"
allowed_dependencies = ["assets"]
forbidden_dependencies = ["asset-compiler", "clap", "bevy", "wgpu"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "asset-compiler", "clap", "protocol", "client-world", "chunk-pipeline", "render", "bevy", "bevy_*", "wgpu*"]

[[crates]]
name = "chunk-pipeline"
path = "crates/chunk-pipeline"
test_support_features = ["publication-test-support", "benchmark-support"]
allowed_dependencies = ["client-world", "meshing", "assets", "world", "render-api", "test-time"]
# Protocol is permitted only in fixtures; production consumes client-world's admitted contracts.
forbidden_dependencies = ["asset-compiler", "pack-compiler", "protocol", "bevy", "wgpu"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "asset-compiler", "pack-compiler", "ui", "json-ui", "render", "bevy", "bevy_*", "wgpu*"]

[[crates]]
name = "inventory"
path = "crates/inventory"
allowed_dependencies = ["protocol"]
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "ui", "json-ui", "render", "bevy", "bevy_*", "wgpu*", "client-world", "world"]

[[crates]]
name = "player-state"
path = "crates/player-state"
allowed_dependencies = ["client-world", "inventory"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "launcher", "client-ui", "ui", "json-ui", "render", "bevy", "bevy_*", "wgpu*"]

# Tick decisions and transport remain separate domains; app adapters compose them.
[[crates]]
name = "gameplay"
path = "crates/gameplay"
allowed_dependencies = ["assets", "block-transform", "client-world", "inventory", "player-state", "protocol", "semantic-input", "sim", "world"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "client-session", "client-presentation", "acceptance", "launcher", "client-ui", "chunk-pipeline", "ui", "json-ui", "render", "asset-compiler", "pack-compiler", "bevy", "bevy_*", "wgpu*"]
test_support_features = ["test-support"]

[[crates]]
name = "client-session"
path = "crates/client-session"
allowed_dependencies = ["assets", "block-transform", "pack-compiler", "protocol", "resource-pack", "server-experience", "world"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "gameplay", "client-presentation", "acceptance", "launcher", "client-ui", "client-world", "chunk-pipeline", "inventory", "player-state", "semantic-input", "ui", "json-ui", "render", "asset-compiler", "bevy", "bevy_*", "wgpu*"]
test_support_features = ["test-support"]

[[crates]]
name = "launcher"
path = "crates/launcher"
allowed_dependencies = ["assets", "protocol", "render-api", "resource-pack", "semantic-input", "server-experience", "ui"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "client-ui", "player-state", "inventory", "client-world", "world", "sim", "render", "asset-compiler", "pack-compiler", "bevy", "bevy_*", "wgpu*"]

[[crates]]
name = "client-ui"
path = "crates/client-ui"
# Extension edges support presentation adapters; render data comes from render-model, never render.
allowed_dependencies = ["assets", "chunk-pipeline", "client-world", "player-state", "launcher", "inventory", "json-ui", "protocol", "render-api", "render-model", "resource-pack", "semantic-input", "ui", "world", "mod-host", "server-experience", "test-time"]
forbidden_dependencies = ["asset-compiler", "pack-compiler"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "gameplay", "client-session", "render"]
test_support_features = ["test-support"]

# Presentation borrows authoritative facts; transport/gameplay and evidence stay outside it.
[[crates]]
name = "client-presentation"
path = "crates/client-presentation"
allowed_dependencies = ["assets", "chunk-pipeline", "client-ui", "client-world", "inventory", "launcher", "player-state", "protocol", "render", "render-api", "render-model", "resource-pack", "semantic-input", "sim", "ui", "world", "meshing", "server-experience", "test-time"]
forbidden_dependencies = ["asset-compiler", "pack-compiler"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "gameplay", "client-session", "acceptance", "asset-compiler"]
test_support_features = ["test-support"]

[[crates]]
name = "diagnostics"
path = "crates/diagnostics"
allowed_dependencies = ["assets", "chunk-pipeline", "libc", "meshing", "protocol", "render-model", "rustix", "windows-sys", "world"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "gameplay", "client-session", "acceptance", "client-presentation", "asset-compiler", "pack-compiler", "render"]

[[crates]]
name = "acceptance"
path = "crates/acceptance"
test_support_features = ["test-support"]
allowed_dependencies = ["chunk-pipeline", "client-presentation", "client-world", "diagnostics", "protocol", "render", "render-model", "semantic-input", "world"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "gameplay", "client-session", "asset-compiler", "pack-compiler"]

[[crates]]
name = "semantic-input"
path = "crates/input"
allowed_dependencies = []
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]

# Control wire, auth and recording primitives shared by the client glue and controllers.
[[crates]]
name = "developer-control"
path = "crates/developer-control"
allowed_dependencies = ["test-time"]
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]

[[crates]]
name = "render-api"
path = "crates/render-api"
allowed_dependencies = []
# Shared contracts stay std-only, including build, dev and target dependencies.
dependency_free = true

# Test-only waits and manual clocks; std-only, and only ever a dev-dependency.
[[crates]]
name = "test-time"
path = "crates/test-time"
allowed_dependencies = []
dependency_free = true

# Render data contracts and CPU geometry; presentation builds against it without the GPU renderer.
[[crates]]
name = "render-model"
path = "crates/render-model"
allowed_dependencies = ["assets", "render-api", "world"]
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "render", "protocol", "client-world", "chunk-pipeline", "bevy", "bevy_*", "wgpu*"]

# CPU particle simulation; render only uploads and draws its output.
[[crates]]
name = "particles"
path = "crates/particles"
allowed_dependencies = ["assets"]
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "render", "protocol", "client-world", "chunk-pipeline", "bevy", "bevy_*", "wgpu*"]

[[crates]]
name = "render"
path = "crates/render"
test_support_features = ["publication-test-support"]
allowed_dependencies = ["assets", "block-transform", "meshing", "mod-api", "mod-render", "particles", "render-api", "render-model", "tracy-client", "world", "test-time"]
forbidden_dependencies = ["asset-compiler"]
# Also reject game-state edges hidden behind another local crate or test dependency.
forbidden_transitive_dependencies = ["client-world", "chunk-pipeline", "protocol"]


# Gameplay receives facts and inventory directly; UI may only borrow authority.
[[module_boundaries]]
path = "app/src/movement"
forbidden_modules = ["ui_runtime", "client_ui", "ui", "UiRuntime"]

[[module_boundaries]]
path = "app/src/ui_runtime"
forbidden_owned_types = ["InventorySession", "PlayerInventoryLedger", "LocalPlayerFacts", "AbilitiesUpdate", "PlayerState", "PlayerRuntime"]

[[module_boundaries]]
path = "crates/client-ui/src"
forbidden_modules = ["bedrock_client"]
forbidden_crate_modules = ["app", "runtime", "movement", "mining", "item_use", "camera", "server_camera", "local_player", "semantic_controls", "settings_runtime", "acceptance", "audio", "block_selection", "block_use", "hotbar", "pick_block", "melee", "survival_mining"]
forbidden_owned_types = ["InventorySession", "PlayerInventoryLedger", "LocalPlayerFacts", "AbilitiesUpdate", "PlayerState", "PlayerRuntime"]

[[module_boundaries]]
path = "crates/launcher/src"
forbidden_modules = ["bedrock_client", "client_ui", "UiRuntime", "PlayerRuntime", "PlayerState", "NetworkHandle"]
forbidden_crate_modules = ["ui_runtime", "presentation", "runtime", "movement", "acceptance"]

# Fixtures can be shared by tests without becoming callable from production adapters.
[[module_boundaries]]
path = "app/src"
forbidden_modules = ["test_support"]

# Authoritative world state cannot regain mesh scheduling or publication ownership.
[[module_boundaries]]
path = "crates/client-world/src"
forbidden_modules = ["chunk_pipeline", "meshing", "render_api"]
forbidden_owned_types = ["ChunkMesh", "PublicationPermit", "PublicationAllowance", "MeshMemoryPermit"]

# The coordinator composes the authority owner, never a second mutable world store.
[[module_boundaries]]
path = "crates/chunk-pipeline/src"
forbidden_owned_types = ["ChunkStore", "ActorStore"]

# Plugin code consumes explicit observations, never host modules or session/gameplay owners.
[[module_boundaries]]
path = "crates/client-presentation/src"
forbidden_modules = ["bedrock_client", "gameplay", "client_session", "NetworkHandle", "MovementTicker", "LocalPhysicsController", "ItemUseRuntime", "MiningRuntime"]
forbidden_crate_modules = ["app", "runtime", "movement", "item_use", "mining", "melee", "menu", "acceptance", "asset_startup", "player_runtime", "semantic_controls", "settings_runtime", "screen_policy"]
forbidden_owned_types = ["WorldStream", "PlayerState", "PlayerInventoryLedger", "InventorySession", "LocalPlayerFacts"]

[[module_boundaries]]
path = "crates/acceptance/src"
forbidden_modules = ["bedrock_client", "gameplay", "client_session", "NetworkHandle", "MovementTicker", "LocalPhysicsController", "ClientWorld"]
forbidden_crate_modules = ["app", "runtime", "movement", "item_use", "mining", "menu", "asset_startup", "player_runtime"]
forbidden_owned_types = ["WorldStream", "PlayerState", "PlayerInventoryLedger", "InventorySession", "LocalPlayerFacts"]

[[module_boundaries]]
path = "crates/diagnostics/src"
forbidden_modules = ["bedrock_client", "gameplay", "client_session", "acceptance", "NetworkHandle", "ClientWorld"]
forbidden_crate_modules = ["app", "runtime", "movement", "asset_startup"]

# Lower domains cannot reach app adapters through rooted or renamed module paths.
[[module_boundaries]]
path = "crates/gameplay/src"
forbidden_modules = ["bedrock_client", "bevy", "render", "client_ui", "client_session", "chunk_pipeline", "UiRuntime", "NetworkHandle"]
forbidden_crate_modules = ["app", "runtime", "camera", "server_camera", "local_player", "semantic_controls", "settings_runtime", "acceptance", "audio", "session_audio", "presentation", "ui_runtime", "menu"]
forbidden_owned_types = ["InventorySession", "PlayerInventoryLedger", "LocalPlayerFacts", "PlayerState", "ChunkStore", "ActorStore", "WorldAuthority"]

# This is sim::PlayerState (predicted position/velocity), not inventory/player authority.
[[module_boundaries.ownership_exceptions]]
path = "crates/gameplay/src/movement/physics.rs"
owner = "LocalPhysicsController"
owned_type = "PlayerState"

[[module_boundaries]]
path = "crates/client-session/src"
forbidden_modules = ["bedrock_client", "bevy", "render", "client_ui", "gameplay", "chunk_pipeline", "UiRuntime", "MovementTicker"]
forbidden_crate_modules = ["app", "runtime", "movement", "camera", "local_player", "acceptance", "audio", "session_audio", "presentation", "ui_runtime", "menu"]
forbidden_owned_types = ["InventorySession", "PlayerInventoryLedger", "LocalPlayerFacts", "PlayerState", "ChunkStore", "ActorStore", "WorldAuthority"]

[[module_boundaries]]
path = "crates/particles/src"
forbidden_modules = ["bevy", "wgpu"]

[[crates]]
name = "rich-presence"
path = "crates/rich-presence"
allowed_dependencies = ["launcher"]
forbidden_dependencies = ["bevy", "wgpu"]

# Coordinate-derived block component data stays independent of palette and render state.
[[crates]]
name = "block-transform"
path = "crates/block-transform"
allowed_dependencies = []
dependency_free = true

# Tests wait with `test_time::eventually` (Rust) or `testwait`/`testing/synctest` (Go), never sleep.
# Each exception names why the file still sleeps; converting it removes the entry.
# Domain crates take `now` from their caller; only edge code reads the clock.
[timing]
clock_free_crates = [
    "crates/block-transform",
    "crates/input",
    "crates/inventory",
    "crates/json-ui",
    "crates/meshing",
    "crates/player-state",
    "crates/render-api",
    "crates/resource-pack",
    "crates/sim",
    "crates/ui",
    "crates/world",
]
sleep_exceptions = [
    { path = "crates/client-ui/src/ui_runtime/presentation/forms/test_support.rs", reason = "warm snapshot frames give background menu artwork time to load; no ready signal" },
    { path = "crates/bridge/tests/it/go_echo.rs", reason = "deleted with frame-echo" },
    { path = "crates/client-ui/src/ui_runtime/presentation/forms/menu_latency.rs", reason = "paces idle frames before measuring menu navigation latency" },
    { path = "crates/client-session/src/session/network_latency_bench.rs", reason = "paces movement packets at the simulation tick rate for a latency benchmark" },
    { path = "crates/server-experience/src/cache.rs", reason = "delays lease release and cancellation to exercise a pending cache replacement" },
    { path = "app/src/lifecycle/children.rs", reason = "lets the detached reaper begin stopping a child without an observable ready signal" },
    { path = "app/src/menu/auth.rs", reason = "a deliberately delayed reader verifies cancellation does not wait for its thread" },
    { path = "app/src/menu/launcher_account/artwork.rs", reason = "a slow image fixture verifies feeds publish before artwork downloads" },
    { path = "crates/client-presentation/src/audio/inventory.rs", reason = "keeps the opt-in audio device alive for an audible playback window" },
    { path = "app/src/tests/input_publication.rs", reason = "models expensive frame work while measuring system ordering" },
    { path = "crates/chunk-pipeline/src/stream/tests/light_scheduler.rs", reason = "a worker frees its light-job slot after settling has started" },
    { path = "crates/chunk-pipeline/src/stream/tests/light_scheduler/backlog.rs", reason = "paces frames in a backlog drain-timing test" },
    { path = "crates/chunk-pipeline/src/stream/tests/neighbour_deadlines.rs", reason = "manual timing run past the real unsent-column grace" },
    { path = "crates/chunk-pipeline/src/stream/tests/streaming_harness.rs", reason = "paces frames for the streaming harness" },
    { path = "crates/client-ui/src/remote_images/disk/tests.rs", reason = "a fixture image server that answers slowly or stalls" },
    { path = "crates/client-session/src/session/tests.rs", reason = "a worker still busy when the network handle drops" },
    { path = "tools/cinnabar-mcp/src/tests.rs", reason = "a reply slower than the client's timeout, then the late reply arriving" },
    { path = "core/authcache/concurrency_test.go", reason = "a fake token source that is slow to refresh" },
    { path = "core/authcache/derived_test.go", reason = "a fake service that is slow to answer" },
    { path = "core/authcache/flight_test.go", reason = "racy: sleeps to let goroutines block; needs a ready signal" },
    { path = "core/cmd/bedrock-core/lifecycle_unix_test.go", reason = "a helper process that stays alive until the test kills it" },
    { path = "core/internal/lifeline/lifeline_unix_test.go", reason = "a helper process that stays alive until the test kills it" },
    { path = "core/internal/lockfile/lockfile_test.go", reason = "a lock holder that stays alive until the test kills it" },
    { path = "core/internal/streamnet/conn_test.go", reason = "racy: sleeps to let a write block; needs a ready signal" },
    { path = "core/proxy/first_join_token_live_test.go", reason = "a live, opt-in join profile that keeps credentials warm" },
    { path = "core/proxy/packet_delay_position_test.go", reason = "virtual time inside synctest bubbles" },
    { path = "core/proxy/packet_delay_test.go", reason = "virtual time inside synctest bubbles" },
    { path = "core/proxy/prepared_transport_test.go", reason = "stands in for credential acquisition time" },
    { path = "core/proxy/proxy_test.go", reason = "asserts nothing else arrives within a window" },
    { path = "core/proxy/relay_backpressure_test.go", reason = "a stalled sink; racy wait for the pump to block needs a ready signal" },
    { path = "core/proxy/resource_pack_admission_test.go", reason = "a server that trickles a slow download" },
    { path = "tools/localserver/experience/client_test.go", reason = "separate Go module without core's testwait; convert with its own helper" },
    { path = "tools/localserver/experience/dispatch_test.go", reason = "separate Go module without core's testwait; convert with its own helper" },
    { path = "tools/localserver/experience/helpers_test.go", reason = "separate Go module without core's testwait; convert with its own helper" },
]


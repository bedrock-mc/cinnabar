production_rust_max = 1000
module_root_max = 300
powershell_max = 800
test_max = 1200
forbidden_artifacts = [
    "*.exe",
    "*.dll",
    "*.dylib",
    "*.so",
    "*.png",
    "*.jpg",
    "*.jpeg",
    "*.bmp",
    "*.mcpack",
    "*.mcworld",
]

# Original art, never Mojang content.
[[owned_artifacts]]
path = "assets/panorama/"
ownership_record = "THIRD_PARTY_NOTICES.md"

[[owned_artifacts]]
path = "assets/branding/"
ownership_record = "THIRD_PARTY_NOTICES.md"

# Existing oversized files may only shrink. New files and files below their
# category limit remain governed by the strict limits above.
[[line_baselines]]
path = "app/tests/assets.rs"
max = 1381

[[line_baselines]]
path = "app/src/tests/finish.rs"
max = 1232

[[vendored]]
path = "crates/protocol/vendor/"
ownership_record = "crates/protocol/vendor/UPSTREAM.md"

[[crates]]
name = "bridge"
path = "crates/bridge"
allowed_dependencies = []
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]

[[crates]]
name = "protocol"
path = "crates/protocol"
allowed_dependencies = ["bridge", "render-api"]
forbidden_dependencies = ["asset-compiler", "assets", "bevy", "wgpu"]

[[crates]]
name = "resource-pack"
path = "crates/resource-pack"
allowed_dependencies = ["protocol"]
forbidden_dependencies = ["asset-compiler", "assets", "bevy", "wgpu"]

[[crates]]
name = "world"
path = "crates/world"
allowed_dependencies = []
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]

[[crates]]
name = "assets"
path = "crates/assets"
allowed_dependencies = []
forbidden_dependencies = ["asset-compiler", "bevy", "clap", "image", "wgpu"]

[[crates]]
name = "asset-compiler"
path = "crates/asset-compiler"
allowed_dependencies = ["assets"]
forbidden_dependencies = ["bevy", "wgpu"]

[[crates]]
name = "json-ui"
path = "crates/json-ui"
allowed_dependencies = []
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]

[[crates]]
name = "meshing"
path = "crates/meshing"
allowed_dependencies = ["assets", "world"]
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]

[[crates]]
name = "client-world"
path = "crates/client-world"
allowed_dependencies = ["assets", "meshing", "protocol", "render-api", "world"]
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "ui", "json-ui", "render", "bevy", "bevy_*", "wgpu*"]

[[crates]]
name = "inventory"
path = "crates/inventory"
allowed_dependencies = ["protocol"]
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]
forbidden_transitive_dependencies = ["app", "bedrock-client", "ui", "json-ui", "render", "bevy", "bevy_*", "wgpu*", "client-world", "world"]

[[crates]]
name = "semantic-input"
path = "crates/input"
allowed_dependencies = []
forbidden_dependencies = ["asset-compiler", "bevy", "wgpu"]

[[crates]]
name = "render-api"
path = "crates/render-api"
allowed_dependencies = []
# Shared contracts stay std-only, including build, dev and target dependencies.
dependency_free = true

[[crates]]
name = "render"
path = "crates/render"
allowed_dependencies = ["assets", "meshing", "mod-api", "render-api", "world"]
forbidden_dependencies = ["asset-compiler"]
# Also reject game-state edges hidden behind another local crate or test dependency.
forbidden_transitive_dependencies = ["client-world", "protocol"]

[[crates]]
name = "app"
path = "app"
# asset-compiler is allowed only for the session-time in-memory server-pack entity compile.
allowed_dependencies = ["asset-compiler", "assets", "client-world", "inventory", "json-ui", "meshing", "mod-host", "protocol", "render", "resource-pack", "semantic-input", "server-experience", "sim", "ui", "world"]
forbidden_dependencies = []


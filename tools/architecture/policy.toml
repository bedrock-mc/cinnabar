# Gameplay receives facts and inventory directly; UI may only borrow authority.
[[module_boundaries]]
path = "app/src/movement"
forbidden_modules = ["ui_runtime", "client_ui", "ui", "UiRuntime"]

[[module_boundaries]]
path = "app/src/ui_runtime"
forbidden_owned_types = ["InventorySession", "PlayerInventoryLedger", "LocalPlayerFacts", "AbilitiesUpdate", "PlayerState", "PlayerRuntime"]

[[module_boundaries]]
path = "crates/client-ui/src"
forbidden_modules = ["bedrock_client"]
forbidden_crate_modules = ["app", "runtime", "movement", "mining", "item_use", "camera", "server_camera", "local_player", "semantic_controls", "settings_runtime", "acceptance", "audio", "block_selection", "block_use", "hotbar", "pick_block", "melee", "survival_mining"]
forbidden_owned_types = ["InventorySession", "PlayerInventoryLedger", "LocalPlayerFacts", "AbilitiesUpdate", "PlayerState", "PlayerRuntime"]

[[module_boundaries]]
path = "crates/launcher/src"
forbidden_modules = ["bedrock_client", "client_ui", "UiRuntime", "PlayerRuntime", "PlayerState", "NetworkHandle"]
forbidden_crate_modules = ["ui_runtime", "presentation", "runtime", "movement", "acceptance"]

# Fixtures can be shared by tests without becoming callable from production adapters.
[[module_boundaries]]
path = "app/src"
forbidden_modules = ["test_support"]

# Authoritative world state cannot regain mesh scheduling or publication ownership.
[[module_boundaries]]
path = "crates/client-world/src"
forbidden_modules = ["chunk_pipeline", "meshing", "render_api"]
forbidden_owned_types = ["ChunkMesh", "PublicationPermit", "PublicationAllowance", "MeshMemoryPermit"]

# The coordinator composes the authority owner, never a second mutable world store.
[[module_boundaries]]
path = "crates/chunk-pipeline/src"
forbidden_owned_types = ["ChunkStore", "ActorStore"]

# Plugin code consumes explicit observations, never host modules or session/gameplay owners.
[[module_boundaries]]
path = "crates/client-presentation/src"
forbidden_modules = ["bedrock_client", "gameplay", "client_session", "NetworkHandle", "MovementTicker", "LocalPhysicsController", "ItemUseRuntime", "MiningRuntime"]
forbidden_crate_modules = ["app", "runtime", "movement", "item_use", "mining", "melee", "menu", "acceptance", "asset_startup", "player_runtime", "semantic_controls", "settings_runtime", "screen_policy"]
forbidden_owned_types = ["WorldStream", "PlayerState", "PlayerInventoryLedger", "InventorySession", "LocalPlayerFacts"]

[[module_boundaries]]
path = "crates/acceptance/src"
forbidden_modules = ["bedrock_client", "gameplay", "client_session", "NetworkHandle", "MovementTicker", "LocalPhysicsController", "ClientWorld"]
forbidden_crate_modules = ["app", "runtime", "movement", "item_use", "mining", "menu", "asset_startup", "player_runtime"]
forbidden_owned_types = ["WorldStream", "PlayerState", "PlayerInventoryLedger", "InventorySession", "LocalPlayerFacts"]

[[module_boundaries]]
path = "crates/diagnostics/src"
forbidden_modules = ["bedrock_client", "gameplay", "client_session", "acceptance", "NetworkHandle", "ClientWorld"]
forbidden_crate_modules = ["app", "runtime", "movement", "asset_startup"]

# Lower domains cannot reach app adapters through rooted or renamed module paths.
[[module_boundaries]]
path = "crates/gameplay/src"
forbidden_modules = ["bedrock_client", "bevy", "render", "client_ui", "client_session", "chunk_pipeline", "UiRuntime", "NetworkHandle"]
forbidden_crate_modules = ["app", "runtime", "camera", "server_camera", "local_player", "semantic_controls", "settings_runtime", "acceptance", "audio", "session_audio", "presentation", "ui_runtime", "menu"]
forbidden_owned_types = ["InventorySession", "PlayerInventoryLedger", "LocalPlayerFacts", "PlayerState", "ChunkStore", "ActorStore", "WorldAuthority"]

# This is sim::PlayerState (predicted position/velocity), not inventory/player authority.
[[module_boundaries.ownership_exceptions]]
path = "crates/gameplay/src/movement/physics.rs"
owner = "LocalPhysicsController"
owned_type = "PlayerState"

[[module_boundaries]]
path = "crates/client-session/src"
forbidden_modules = ["bedrock_client", "bevy", "render", "client_ui", "gameplay", "chunk_pipeline", "UiRuntime", "MovementTicker"]
forbidden_crate_modules = ["app", "runtime", "movement", "camera", "local_player", "acceptance", "audio", "session_audio", "presentation", "ui_runtime", "menu"]
forbidden_owned_types = ["InventorySession", "PlayerInventoryLedger", "LocalPlayerFacts", "PlayerState", "ChunkStore", "ActorStore", "WorldAuthority"]

[[module_boundaries]]
path = "crates/particles/src"
forbidden_modules = ["bevy", "wgpu"]

[[crates]]
name = "rich-presence"
path = "crates/rich-presence"
allowed_dependencies = ["launcher"]
forbidden_dependencies = ["bevy", "wgpu"]

# Coordinate-derived block component data stays independent of palette and render state.
[[crates]]
name = "block-transform"
path = "crates/block-transform"
allowed_dependencies = []
dependency_free = true

# Gameplay receives facts and inventory directly; UI may only borrow authority.
[[module_boundaries]]
path = "app/src/movement"
forbidden_modules = ["ui_runtime", "ui", "UiRuntime"]

[[module_boundaries]]
path = "app/src/ui_runtime"
forbidden_owned_types = ["InventorySession", "PlayerInventoryLedger", "LocalPlayerFacts", "AbilitiesUpdate", "PlayerRuntime"]

[[module_boundaries.ownership_exceptions]]
path = "app/src/ui_runtime/presentation_snapshot.rs"
owner = "PresentationInventory"
owned_type = "PlayerInventoryLedger"

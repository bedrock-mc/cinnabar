allowed_dependencies = ["assets", "block-transform", "meshing", "mod-api", "mod-render", "particles", "render-api", "render-model", "tracy-client", "world"]
forbidden_dependencies = ["asset-compiler"]
# Also reject game-state edges hidden behind another local crate or test dependency.
forbidden_transitive_dependencies = ["client-world", "chunk-pipeline", "protocol"]


[package]
name = "web-spectator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "web_spectator"
crate-type = ["cdylib", "rlib"]

[dependencies]
assets = { path = "../../../crates/assets" }
meshing = { path = "../../../crates/meshing" }
world = { path = "../../../crates/world" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
client-world = { path = "../../../crates/client-world" }
gameplay = { path = "../../../crates/gameplay" }
protocol = { path = "../../../crates/protocol" }
particles = { path = "../../../crates/particles" }
render-api = { path = "../../../crates/render-api" }
render-model = { path = "../../../crates/render-model" }
view-presentation = { path = "../../../crates/view-presentation" }
wasm-bindgen = "=0.2.126"
js-sys = "0.3"
render = { path = "../../../crates/render" }
ui = { path = "../../../crates/ui" }
json-ui = { path = "../../../crates/json-ui" }
bevy = { workspace = true, default-features = false, features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_log",
    "bevy_mesh",
    "bevy_render",
    "bevy_shader",
    "bevy_window",
    "bevy_winit",
    "webgpu",
    "std",
] }
